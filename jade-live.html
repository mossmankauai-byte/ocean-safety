<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OceanSafe — partner demo kit</title>
<link rel="icon" type="image/png" href="icons/apple-touch-icon.png">
<style>
  :root{
    --bg:#08121a; --ink:#EAF2F5; --ink2:#AFC2CC; --ink3:#7E939E;
    --gold:#D9B26A; --gold-ink:#12202A; --calm:#5DCAA5; --caution:#EFC873; --rough:#E88E7B;
    --glass:rgba(20,35,44,.55); --glass-2:rgba(28,45,55,.62); --line:rgba(233,242,245,.12); --line-2:rgba(233,242,245,.20);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg); min-height:100vh; -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;z-index:0;pointer-events:none}
  .orb.a{width:520px;height:520px;background:#12715a;top:-160px;right:-120px}
  .orb.b{width:460px;height:460px;background:#9a7a1e;bottom:-180px;left:-140px;opacity:.42}
  .orb.c{width:420px;height:420px;background:#124a75;top:38%;left:46%;opacity:.36}
  .wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:22px 18px 60px}
  .serif{font-family:Georgia,"Times New Roman",serif}
  svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
  .glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(135%);backdrop-filter:blur(18px) saturate(135%);border:1px solid var(--line);border-radius:var(--radius)}

  header.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .logo{display:flex;align-items:center;gap:9px}
  .logo .mark{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
  .logo b{font-weight:500;font-size:16px;letter-spacing:.2px}
  .logo span{display:block;font-size:11.5px;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase}

  .setup{padding:14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .fld{flex:1 1 220px;min-width:180px}
  .fld label{display:block;font-size:12px;color:var(--ink3);margin:0 0 5px;letter-spacing:.02em}
  .inp{width:100%;background:rgba(9,18,25,.55);border:1px solid var(--line-2);color:var(--ink);
    font-size:15px;padding:10px 12px;border-radius:11px;outline:none}
  .inp::placeholder{color:#5f747f}
  .inp:focus{border-color:var(--gold)}
  .beachrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
  .bchip{font-size:12.5px;padding:6px 11px;border-radius:20px;border:1px solid var(--line-2);color:var(--ink2);cursor:pointer;user-select:none;background:rgba(9,18,25,.35)}
  .bchip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

  nav.tabs{display:flex;gap:4px;padding:5px;margin-bottom:16px;width:max-content;max-width:100%}
  nav.tabs button{appearance:none;background:transparent;border:0;color:var(--ink2);font-size:14.5px;
    padding:9px 16px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
  nav.tabs button.on{background:rgba(217,178,106,.16);color:var(--gold)}
  nav.tabs button:not(.on):hover{color:var(--ink)}

  .panel{display:none;animation:fade .25s ease}
  .panel.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .lead{font-size:13.5px;color:var(--ink2);margin:0 0 14px;display:flex;align-items:center;gap:8px}
  .lead .who{color:var(--gold)}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}
  .tile{padding:0;overflow:hidden;cursor:pointer;transition:transform .15s ease,border-color .15s ease;text-align:left}
  .tile:hover{transform:translateY(-3px);border-color:var(--line-2)}
  .thumb{height:120px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:linear-gradient(150deg,#12303a,#0c2029)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .ph{color:#4f6b76}
  .thumb .ph svg{width:34px;height:34px;stroke-width:1.4}
  .badge{position:absolute;top:8px;left:9px;font-size:10.5px;padding:2px 9px;border-radius:20px;background:var(--calm);color:#08201a;font-weight:500;letter-spacing:.03em}
  .badge.op{background:var(--gold);color:var(--gold-ink)}
  .tmeta{padding:11px 13px 13px}
  .tmeta h3{margin:0 0 3px;font-size:14.5px;font-weight:500}
  .tmeta p{margin:0;font-size:12.5px;color:var(--ink3);line-height:1.45}
  .tgo{margin-top:9px;font-size:12px;color:var(--gold);display:flex;align-items:center;gap:5px}

  /* modal */
  .scrim{position:fixed;inset:0;z-index:50;background:rgba(4,10,14,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;padding:18px}
  .scrim.on{display:flex}
  .modal{max-width:420px;width:100%;overflow:hidden;background:var(--glass-2);
    -webkit-backdrop-filter:blur(22px) saturate(135%);backdrop-filter:blur(22px) saturate(135%);
    border:1px solid var(--line-2);border-radius:18px;animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  .mhero{height:172px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:linear-gradient(150deg,#12303a,#0c2029)}
  .mhero img{width:100%;height:100%;object-fit:cover}
  .mhero .ph svg{width:44px;height:44px;stroke:#5b7883;stroke-width:1.3}
  .mclose{position:absolute;top:10px;right:11px;width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(6,14,20,.5);color:var(--ink);display:flex;align-items:center;justify-content:center}
  .mbody{padding:16px 17px 17px}
  .mbody h3{margin:0 0 9px;font-size:17px;font-weight:500}
  .mrow{font-size:13.5px;color:var(--ink2);line-height:1.5;margin:0 0 7px}
  .mrow .who{color:var(--gold)}
  .mbtns{display:flex;gap:9px;margin-top:14px}
  .btn{flex:1;text-align:center;font-size:13.5px;padding:11px;border-radius:12px;cursor:pointer;border:1px solid transparent;
    display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
  .btn.pri{background:var(--gold);color:var(--gold-ink)}
  .btn.sec{background:transparent;border-color:var(--line-2);color:var(--ink)}
  .btn.pri:hover{filter:brightness(1.05)}
  .btn.sec:hover{border-color:var(--gold);color:var(--gold)}
  .btn.wide{flex:none;width:100%}

    .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:80;opacity:0;
    background:var(--gold);color:var(--gold-ink);font-size:13.5px;padding:11px 18px;border-radius:12px;transition:.25s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:520px){ .wrap{padding:16px 12px 50px} .thumb{height:104px} }
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="logo">
      <div class="mark"><svg viewBox="0 0 64 64" width="36" height="36" aria-hidden="true"><defs><linearGradient id="osGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0b485b"/><stop offset="100%" stop-color="#1b6d83"/></linearGradient></defs><circle cx="32" cy="32" r="30" fill="url(#osGrad)"/><circle cx="46" cy="20" r="5" fill="#e07856"/><path d="M5 38 Q15 32 25 38 T45 38 T62 38" stroke="#f5ecd7" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M5 46 Q15 40 25 46 T45 46 T62 46" stroke="#94becc" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85"/><path d="M5 53 Q15 48 25 53 T45 53 T62 53" stroke="#c9a84c" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.75"/></svg></div>

      <label>Nearest beaches (tap the ones by this property)</label>
      <div class="beachrow" id="beachrow"></div>
    </div>
  </section>

  <nav class="tabs glass" role="tablist">
    <button class="on" data-panel="demo" role="tab"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg> Demo</button>
  </nav>

  <!-- DEMO -->
  <section class="panel on" id="panel-demo">
    <p class="lead"><svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M9 18l6-6-6-6"/></svg> Tap any card to show <span class="who">&nbsp;what your guests see&nbsp;</span> then open it live.</p>
    <div class="tiles" id="tiles"></div>
  </section>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

  var $ = function(s,r){return (r||document).querySelector(s);};
  var pname = $("#pname"), selBeaches = [];

  function slug(){ var v=(pname.value||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); return v||"your-resort"; }
  function displayName(){ return (pname.value||"").trim() || "Your Resort"; }
  function liveUrl(t){
    var base = t.url || LIVE;
    var q = (t.param==="slug") ? ("slug="+slug()) : ("ref="+slug());
    var hash = t.tab ? ("#"+t.tab) : "";
    return base + (base.indexOf("?")>-1?"&":"?") + q + hash;
  }

  // ---- beaches picker ----
  var brow = $("#beachrow");
  BEACHES.forEach(function(b){
    var el=document.createElement("span"); el.className="bchip"; el.textContent=b;
    el.onclick=function(){ el.classList.toggle("on");
      selBeaches = Array.prototype.filter.call(brow.children,function(c){return c.classList.contains("on");}).map(function(c){return c.textContent;});
    };
    brow.appendChild(el);
  });

  // ---- tiles ----
  var tilesEl = $("#tiles");
  function thumbInner(t){
    if(IMAGES[t.id]) return '<img src="'+IMAGES[t.id]+'" alt="'+t.label+' screenshot">';
    return '<div class="ph"><svg class="ic" viewBox="0 0 24 24">'+t.ic+'</svg></div>';
  }
  TILES.forEach(function(t){
    var el=document.createElement("div"); el.className="tile glass";
    el.innerHTML='<div class="thumb">'+thumbInner(t)+
      '<span class="badge '+(t.op?"op":"")+'">'+(t.op?"Yours":"Live")+'</span></div>'+
      '<div class="tmeta"><h3>'+t.label+'</h3><p>'+t.teaser+'</p>'+
      '<div class="tgo">Open <svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div>';
    el.onclick=function(){ openModal(t); };
    tilesEl.appendChild(el);
  });

  // ---- modal ----
  var scrim=$("#scrim"), modal=$("#modal");
  function openModal(t){
    var hero = IMAGES[t.id] ? '<img src="'+IMAGES[t.id]+'" alt="'+t.label+'">' :
      '<div class="ph"><svg class="ic" viewBox="0 0 24 24">'+t.ic+'</svg></div>';
    modal.innerHTML =
      '<div class="mhero">'+hero+'<button class="mclose" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'+
      '<div class="mbody"><h3>'+t.label+'</h3>'+
      '<p class="mrow"><span class="who">For your guests:</span> '+t.guests+'</p>'+
      '<p class="mrow"><span class="who">For you:</span> '+t.you+'</p>'+
      '<div class="mbtns">'+
        '<a class="btn pri" href="'+liveUrl(t)+'" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M14 3h7v7M21 3l-9 9M10 5H5a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-5"/></svg> Open live</a>'+
        '<button class="btn sec" data-txt="'+liveUrl(t)+'"><svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg> Text me</button>'+
      '</div></div>';
    $(".mclose",modal).onclick=closeModal;
    $(".btn.sec",modal).onclick=function(){ copy(this.getAttribute("data-txt"), "Link copied — paste it into a text"); };
    scrim.classList.add("on");
  }
  function closeModal(){ scrim.classList.remove("on"); }
  scrim.onclick=function(e){ if(e.target===scrim) closeModal(); };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeModal(); });

  // ---- tabs ----
  Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"),function(b){
    b.onclick=function(){
      document.querySelectorAll("nav.tabs button").forEach(function(x){x.classList.remove("on");});
      b.classList.add("on");
      document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("on");});
      $("#panel-"+b.getAttribute("data-panel")).classList.add("on");
    };
  });

  // ---- personalisation ----
  function syncName(){
    var dn=displayName();
    localStorage.setItem("jadeProperty", pname.value||"");
  }
  pname.addEventListener("input", syncName);

  // ---- helpers ----
  var toast=$("#toast"), tt;
  function flash(m){ toast.textContent=m; toast.classList.add("on"); clearTimeout(tt); tt=setTimeout(function(){toast.classList.remove("on");},1900); }
  function copy(txt,msg){
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){flash(msg);},function(){flash(txt);}); }
    else { var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");flash(msg);}catch(e){flash(txt);} document.body.removeChild(ta); }
  }

  // init
  var saved=localStorage.getItem("jadeProperty"); if(saved){ pname.value=saved; syncName(); }
})();
</script>
