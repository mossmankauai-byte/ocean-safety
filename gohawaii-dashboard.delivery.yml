# Delivery spec for gohawaii-dashboard.html (GoHawaii review build). Required by oscheck.py --type console.
recipient: Nick first, then Andy Evers, then HVCB and HTA staff via Andy
segment: public
tier: free
fulfillment: none server-side. Posts save to localStorage on htagohawaii.netlify.app in the poster's own browser only; no Supabase write, no visitor ever receives them
must_be_true_after: a post shows in the app opened from the Dashboard's own Preview link in the same browser; red shows only after a second approval; expired posts vanish; every action lands in the audit log; the page says plainly that posts stay in this browser
