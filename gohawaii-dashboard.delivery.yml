# Delivery spec for gohawaii-dashboard.html, LIVE build (gh/config.js names the gohawaii-api backend).
# Rewritten 2026-09-23 after the ship check held the first live deploy (blocker 4). Git has the review-build version.
recipient: Nick first; then State (HTA/HVCB) and county staff, each signing in with a personal staff key Nick issues. Visitors reach the app through the GoHawaii link. Review site only (htagohawaii.netlify.app, Netlify 5da479a8), never production.
segment: public
tier: free
fulfillment: server-side, on OceanSafe's own Cloudflare Worker gohawaii-api (D1 gohawaii), separate from every other OceanSafe backend. Staff sign in with a personal key (only its SHA-256 is stored); posts and place changes save to the server and reach every browser; the server fills who did what from the key, holds a red advisory until an Approver who did not write it approves it, and keeps county keys to their own island. The app sends daily visit totals with no id and no location. Nothing charges, no Square link, no OceanSafe money term anywhere.
must_be_true_after: a signed-in person's post or place change shows in the app in a different browser within about a minute; red shows to visitors only after a second person, an Approver, approves it; a county key cannot post or change places for another island; every save lands in the audit log with the signed-in name. Visitors view: the first card is live totals, labeled as real, with any count under ten shown as "under 10" and any id the app does not know left out; every card below it carries a Sample chip. Report view: labeled sample, says live totals are in the Visitors view. No copy says posts stay in this browser or that nothing is counted; the review-data Clear button is hidden. Only Kauaʻi, Oʻahu, Maui, Hawaiʻi Island; "All four islands", never "All islands"; no efficacy or drowning-outcome claim; no dollar figure.
layer_data: gh/beaches.json, data/poi-gohawaii-*.js
