# Delivery spec for gohawaii-dashboard.html (GoHawaii review build; review mode restored 2026-09-23, live-build spec is in git at 5c1b835). Required by oscheck.py --type console.
# Updated 2026-09-19 for the extra County/State datasets on the Visitors view and the Monthly report view. Prior spec: .bak-2026-09-19
# Updated 2026-09-26 for the Assumptions readability redesign (release captain Phase 1); prior text is in git at 09834eb.
# Updated 2026-09-29 for the per-tab tour layer (release captain Phase 1); prior text is in git at 001a61d.
# Updated 2026-10-01 for the QR codes view (release captain Phase 1); prior text is in git at 2ada076.
recipient: Nick first; then State (HTA/HVCB) and county staff reviewing the build. Review site only (htagohawaii.netlify.app, Netlify 5da479a8), never production. REVIEW MODE since 2026-09-23 (gh/config.js api empty): no sign-in, posts and place changes stay in each browser, nothing counted; the gohawaii-api backend stays deployed but unused.
segment: public
tier: free
fulfillment: none server-side. Surface is https://htagohawaii.netlify.app/gohawaii-dashboard on the review site (5da479a8), never production. Advisory posts save to localStorage in the poster's own browser only. Every Visitors and Report figure is SAMPLE (index.html PUBLIC_REFS = ['gohawaii'] switches telemetry off): Kauaʻi rows from county-insights-demo.html and the two saved catalogues (County of Kauaʻi 33, HTA 38), other three islands scaled, beach names from gh/beaches.json. Promotions view (2026-09-19): an Editor posts kind=promo (title, one line, link, islands, daily hours and days in Hawaiʻi time, active dates) into the same localStorage key; the app on the same browser shows it on the Town tab chip, once per visit as a pop-up, and on the GoHawaii page, only inside its hours; its action opens its own link in a new tab; no Supabase, no network. Report exports are browser-only: window.print for PDF, Blob download for CSV and JSON, clipboard for the text summary; dataset toggles in localStorage under one key. Zero requests to any telemetry host. The Live data switch is disabled by design
must_be_true_after: a post shows in the app opened from the Dashboard's own Preview link in the same browser; red shows only after a second approval; expired posts vanish; every action lands in the audit log. Visitors view: the Sample ribbon is visible, every card carries a Sample chip plus its catalogue rank and status (counting today, in build, or waiting on the agency), the Live data switch stays disabled with the reason stated, the aggregate-only privacy line and the "what is counted today" block still say no live count exists. Report view: the Sample ribbon is visible, the period and scope are named, presets and per-dataset toggles change the document, scope reads "All four islands" (never "All islands"), every export line carries Sample and the catalogue rank and status, the Act 104 compliance rows name areas only and show the suppressed row, no dollar figure, no offer, no price, no absolute usage claim (OD-18 floor rule), no efficacy or drowning-outcome claim, only Kauaʻi, Oʻahu, Maui, Hawaiʻi Island; both views render with the Leaflet CDN blocked. Promotions: a promotion inside its Hawaiʻi-time hours shows the Town chip with the live dot and a sheet headed From GoHawaii with its title and link; outside its hours no chip; _planPaid() stays false on the public ref; no telemetry or checkout request; a promotion never sits on a red or yellow beach sheet; a red advisory still needs a second approval and a promotion never does; no OceanSafe money term inside a promotion; copy never says a post goes live beyond this browser Places: staff can add, edit, hide and remove places for the island picked; a change shows in the app in the same browser at once; GoHawaii's layer file is never rewritten (edits store only the changed fields); an added place is credited to the State or county that keeps it, never to GoHawaii; beaches are not editable here; every change lands in the audit log. Assumptions to test (2026-09-23): the section sits at the top of the Report view with its own toggle; every line opens "Working assumption:", carries a High, Moderate or Low chip plus a Sample chip, a Confirm and an Overturn dated to weeks, the owning agency and one Consider clause; the print, CSV, JSON and clipboard exports carry the same lines; the Overview card shows the three strongest; a rule that lacks data says what it needs; no line names a store, an outcome, a dollar figure or "All islands". Overview card and log periods (2026-09-23): the Assumptions card on the Overview is collapsed by default and opens with a Show assumptions button (the choice is remembered in this browser) and takes Week, Month to date, Year to date or a range the reader sets; a refused range says why; the Activity log filters by the same periods, lists newest first, and exports as text for an email (Copy for email), a CSV with dated Hawaiʻi stamps, or a mailto link that opens the reader's own mail app with the entries in the body; nothing is sent by the Dashboard; the three exports disable together on a bad range. Readability redesign (2026-09-26, work/gohawaii-assumptions, review site only): the rules, figures, tests and wording law are unchanged, so GH_ASM.exports (csv, json, text) for the same island and period match the v394 output line for line (the diff is the proof); every fired line carries one generated "why this grade" line that names the gate that set the grade using the method note's own four names (Precision, Source, Agreement, Stability) with the figure that tripped it, and carries no likelihood word and none of "because", "means", "shows"; the section intro and the method note read in the same order as the four gates; the Overview card still opens collapsed with Show assumptions; the Report section still prints from page 1; both widths render without sideways scroll; sw bumps past v394 (no branch holds a higher number as of 2026-09-26). Tour layer (2026-09-29, work/culture-art, review site only): one TOURS table drives nine per-view tours (now, adv, feat, promo, place, use, rep, prev, log); each runs once per browser on first open of its view (localStorage ghd_tour_v1, one flag per view plus an all flag) and replays from the Tour button in the rail for the current view only; every step selector resolves to an existing element in its view or the step is skipped; a step never posts, approves, clears, sends, switches a role, or changes a saved preference; after all nine tours ghd_log_v1 has gained no rows and no key other than ghd_tour_v1 is new; the tour makes no network request; Esc closes, arrow keys move, focus sits in the card; both widths render the card inside the viewport; the tour copy carries no offer, money term, open-defect trigger, em dash, or "visitors" as a count; sw bumps to v398 (highest sibling v397 as of 2026-09-29); production is untouched. QR codes view (2026-10-01, work/gohawaii-qr, review site only): a tenth rail button QR codes; a named code encodes this origin /?ref=gohawaii&island=<island picked>&u=<tag>, the tag being the name as a-z 0-9 hyphen, 16 characters; the 1200 px PNG decodes (zbarimg) to that URL with the app mark at 16% and errorCorrectionLevel H, drawn with smoothing off; three sample codes seed a fresh browser; every code made gets its own line in the chart at once; the chart is Sample only, its copy says nothing is counted in the review build, and it is never tied to the Entry points card on the Visitors view; names stay in localStorage (ghd_qr_v1); Download, Email (mailto with the link), Share (navigator.share) and Copy link send nothing from the Dashboard; making or removing a code lands in the audit log; a tenth tour (qr) runs once on first open like the other nine and the suite covers ten views; the copy carries no OceanSafe money term, no oceansafety.app, no em dash; sw bumps to v404 (highest sibling v403 as of 2026-10-01); production untouched.
layer_data: gh/beaches.json
