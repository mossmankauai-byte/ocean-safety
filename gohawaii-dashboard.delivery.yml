# Delivery spec for gohawaii-dashboard.html (GoHawaii review build). Required by oscheck.py --type console.
# Updated 2026-09-19 for the extra County/State datasets on the Visitors view and the Monthly report view. Prior spec: .bak-2026-09-19
recipient: Nick first; then Andy Evers (Aloha Hospitality Advisors), who forwards to HVCB and HTA. No County recipient this round
segment: public
tier: free
fulfillment: none server-side. Surface is https://htagohawaii.netlify.app/gohawaii-dashboard on the review site (5da479a8), never production. Advisory posts save to localStorage in the poster's own browser only. Every Visitors and Report figure is SAMPLE (index.html PUBLIC_REFS = ['gohawaii'] switches telemetry off): Kauaʻi rows from county-insights-demo.html and the two saved catalogues (County of Kauaʻi 33, HTA 38), other three islands scaled, beach names from gh/beaches.json. Promotions view (2026-09-19): an Editor posts kind=promo (title, one line, link, islands, daily hours and days in Hawaiʻi time, active dates) into the same localStorage key; the app on the same browser shows it on the Town tab chip, once per visit as a pop-up, and on the GoHawaii page, only inside its hours; its action opens its own link in a new tab; no Supabase, no network. Report exports are browser-only: window.print for PDF, Blob download for CSV and JSON, clipboard for the text summary; dataset toggles in localStorage under one key. Zero requests to any telemetry host. The Live data switch is disabled by design
must_be_true_after: a post shows in the app opened from the Dashboard's own Preview link in the same browser; red shows only after a second approval; expired posts vanish; every action lands in the audit log. Visitors view: the Sample ribbon is visible, every card carries a Sample chip plus its catalogue rank and status (counting today, in build, or waiting on the agency), the Live data switch stays disabled with the reason stated, the aggregate-only privacy line and the "what is counted today" block still say no live count exists. Report view: the Sample ribbon is visible, the period and scope are named, presets and per-dataset toggles change the document, scope reads "All four islands" (never "All islands"), every export line carries Sample and the catalogue rank and status, the Act 104 compliance rows name areas only and show the suppressed row, no dollar figure, no offer, no price, no absolute usage claim (OD-18 floor rule), no efficacy or drowning-outcome claim, only Kauaʻi, Oʻahu, Maui, Hawaiʻi Island; both views render with the Leaflet CDN blocked. Promotions: a promotion inside its Hawaiʻi-time hours shows the Town chip with the live dot and a sheet headed From GoHawaii with its title and link; outside its hours no chip; _planPaid() stays false on the public ref; no telemetry or checkout request; a promotion never sits on a red or yellow beach sheet; a red advisory still needs a second approval and a promotion never does; no OceanSafe money term inside a promotion; copy never says a post goes live beyond this browser
layer_data: gh/beaches.json
