# Delivery spec for dashboard.html, the one operator surface.
# Required by oscheck.py --type console. The Dashboard is not sent to one recipient:
# it is served at five segment routes and the segment is resolved from the pathname.
# Updated 2026-10-01 for the QR codes tab (release captain Phase 1); prior text is in git at f86759a.
# Updated again 2026-10-01 late for the tours rework.

recipient: any signed-in operator, at their own segment route
segment: hotel, timeshare, pm, rental, concierge, cars   # /rental serves the pm segment
tier: paid    # OS_PLAN defaults to paid; ?plan=free swaps the frame for the free-tier card
fulfillment: >
  Hand-onboarded through the sales-dashboard Close tab, or self-serve through
  /join -> operator-signup-public -> square-webhook. The static square.link
  URLs provision nothing (OD-1) and are never linked from here.
must_be_true_after: >
  The operator lands on their own segment's dashboard, sees their own property
  name in the header, and every tab they can see is about their property.
  Verified by checks/dashboard-ops.js, which must pass 60/60 before a deploy.
  QR codes tab, added 2026-10-01 on work/qr-tab, both tiers, every segment. A named code
  encodes the live guide at oceansafety.app/?ref=<own slug>&island=<own island>&u=<tag>, the tag
  being the name as a-z 0-9 hyphen, 16 characters, the Worker's own sanitizer; the island param
  is omitted when the partner row has none, never empty or null; the downloaded 1200px PNG
  decodes (zbarimg) to that exact URL with the OceanSafe mark at 16% and errorCorrectionLevel H;
  the demo (no slug) encodes the demo guide on the SAME /?ref= shape, labelled Sample, and never
  /stay-close-v2 (OD-13); names live in this browser's localStorage only; Copy link, Download
  PNG, Email (mailto with the link in the body) and Share (navigator.share with the PNG) send
  nothing from the Dashboard; the chart ranks codes by conversion = qr_eng / qr_open from the
  telemetry Worker's rollups (kauai-beach-guide work/qr-tags: qr_open counts guide opens per
  tag, qr_eng the sessions from that tag that tapped a place, offer, amenity or tour), summed
  over the Home period; a code with no counts says so, counts under 5 read fewer than 5 (OD-18),
  no figure is an outcome claim; the Worker must be deployed before the Dashboard, or every
  live code reads No opens from this code yet; the free frame (?plan=free) shows the same tab
  unlocked; checks/dashboard-ops.js walks the tab and passes in full.
  Today tab desk notes, day band for every place, added 2026-10-01 on work/today-poi-band,
  hotel, both tiers: every desk note carries the 6 am to sunset band in five stretches (sky,
  air temp, wind, rain chance, one why line). Farmers' markets, parks, sights and culture,
  food and drink, and event venues read /api/wx?k=live&island=<the place's own island>&lat=&lon=
  at the place's own coordinates rounded to 2 decimals, fetched when the note opens, never on
  render; a place or venue with no coordinates, or coordinates off every island, reads the
  island forecast and the caption says Island forecast, never the place's name; markets show
  the next market day with stretches outside their hours greyed Closed, and a market that ended
  today says the next one is past the hourly forecast; indoor or rain_ok places read Good in
  rain, lookouts read Maybe under heavy cloud; an event past the forecast says so and draws no
  band; live cams carry the watched beach's own surf band; ?plan=free shows the same band;
  checks/dashboard-ops.js passes in full.
  Tours, reworked 2026-10-01 on work/tours-rework: Take the tour shows only stops whose tab
  this segment and plan can see (three Today stops on hotel only,
  two QR stops on all five, the Tours link stop on affiliate-desk segments), never opens by itself, and saves nothing;
  the presenter tour (/hotel?tour=present) still refuses a real property and carries no price;
  its slides come only from rows_li.py through export-tour.py.
  Today upsells, added 2026-10-01 on work/today-upsells, hotel, both tiers: on a rough or rainy
  read (no listed beach Calm, rain likely, or the Rainy day intent) the outlook rail leads with
  the property's own amenities from its Stay-Close menu (OS_HOUSE, the plan-capped list the guest
  app shows), spa and dining first, rentals dropped on a wet day; ?plan=free shows the first
  amenity only. Before sunset a Restaurant amenity is offered from 30 min before. Every tour-kind
  desk note with a non-Skip window carries Book, opening the tour with the operator's own saved
  GetYourGuide partner ID, never OceanSafe's fallback IDs; with none saved it opens the Tours tab.
  No offer beside a beach, trail, hazard-locked place or Events row; no prices; a tap is interest.
