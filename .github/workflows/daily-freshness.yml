name: Daily freshness

# Each morning: write today's readings into the beach pages (so search and assistant
# crawlers, which do not run scripts, can read them), move lastmod and dateModified on the
# pages that changed, then tell IndexNow (Bing and others) which URLs changed.
# Netlify deploys on the push.

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 5:00am HST
  workflow_dispatch: {}      # allow manual runs

permissions:
  contents: write

jobs:
  freshen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write today's readings into the beach pages
        run: python3 scripts/prerender_conditions.py --urls-out "$RUNNER_TEMP/changed-urls.txt"
      - name: Commit and push if changed
        id: push
        run: |
          git config user.name "ocean-safety-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sitemap.xml today/ big-island/today/ maui/today/ oahu/today/
          if git diff --staged --quiet; then
            echo "Nothing to refresh."
          else
            git commit -m "daily: refresh beach page readings ($(date -u +%Y-%m-%d))"
            git push
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Tell IndexNow which pages changed
        if: steps.push.outputs.pushed == '1' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          sleep 180   # let Netlify finish the deploy first
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          urls = pathlib.Path(os.environ["RUNNER_TEMP"], "changed-urls.txt").read_text().split()
          key = "4d379035ee0207d11a5c7b2f56d3377c"
          body = json.dumps({"host": "oceansafety.app", "key": key,
                             "keyLocation": f"https://oceansafety.app/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          print(len(urls), "urls sent, status", urllib.request.urlopen(req, timeout=30).status)
          PY
