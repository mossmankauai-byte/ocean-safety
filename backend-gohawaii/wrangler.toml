# GoHawaii backend: its own Worker and its own D1 database. It shares nothing with the
# partner telemetry worker (concierge-guide-api), so deploying one never touches the other.
# Setup steps are in README.md.
name = "gohawaii-api"
main = "worker.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "gohawaii"
# Paste the id that `wrangler d1 create gohawaii` prints. Local dev (`wrangler dev --local`) runs without it.
database_id = "c3d47d07-320d-465e-a5d3-fb64614837c5"

# Visit totals: at most 30 batches a minute from one address (see ingest in worker.js).
[[ratelimits]]
name = "GH_RL"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[vars]
# Sites allowed to call the staff and stats routes (comma-separated). The visitor count and the
# public read accept any origin, since the app can be embedded.
STAFF_ORIGINS = "https://htagohawaii.netlify.app"
