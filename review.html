<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08222b">
<title>OceanSafe review</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
  :root{
    --sea-900:#08222b; --sea-800:#0a2731; --sea-700:#0f3b48; --deep:#0b6e8f;
    --line:rgba(200,229,238,.16); --ink:#eaf6fa; --steel:#9dc0cc; --steel-dim:#6d919e;
    --cyan:#7fd0e0; --gold:#c9a84c; --green:#4fb286; --r:8px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--sea-900);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  button,select,input,textarea{font:inherit;color:inherit}

  .bar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--sea-800);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;white-space:nowrap}
  .brand img{width:26px;height:26px;border-radius:6px}
  .brand span{display:block;font:10px/1.3 ui-monospace,Menlo,monospace;color:var(--steel-dim);
    font-weight:400;letter-spacing:.4px;text-transform:uppercase}
  .grow{flex:1}
  select,input[type=text]{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);
    background:var(--sea-900);min-width:0}
  select{font-weight:600;max-width:230px}
  select:focus,input[type=text]:focus,textarea:focus{outline:none;border-color:var(--deep)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 13px;
    border-radius:var(--r);border:1px solid var(--line);background:var(--sea-700);cursor:pointer;
    white-space:nowrap;text-align:center}
  .btn:hover{border-color:var(--deep)}
  .btn:active{transform:translateY(1px)}
  .btn.on{background:var(--deep);border-color:var(--cyan);color:#fff}
  .btn.go{background:var(--deep);border-color:var(--deep);color:#fff;font-weight:600}
  .btn.go:hover{background:#0c81a4}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .btn.wide{width:100%}

  .stage{flex:1;display:flex;min-height:0}
  iframe{flex:1;border:0;background:#fff;min-width:0}

  .side{width:330px;flex:none;border-left:1px solid var(--line);background:var(--sea-800);
    display:flex;flex-direction:column;min-height:0}
  .sel{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--steel);
    min-height:44px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sel b{color:var(--cyan);font:600 12px/1.4 ui-monospace,Menlo,monospace}
  .list{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .note{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--r);
    padding:9px 11px;background:rgba(201,168,76,.06)}
  .note .txt{white-space:pre-wrap}
  .note .meta{font:11px/1.5 ui-monospace,Menlo,monospace;color:var(--steel-dim);margin-top:5px}
  .note .del{margin-top:6px;font-size:12px;color:var(--steel-dim);background:none;border:0;
    padding:0;cursor:pointer;text-decoration:underline}
  .empty{color:var(--steel-dim);font-size:13px;padding:6px 2px;line-height:1.6}
  .compose{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:9px}
  textarea{width:100%;min-height:76px;resize:vertical;padding:9px 11px;border-radius:var(--r);
    border:1px solid var(--line);background:var(--sea-900);font:inherit}
  .row{display:flex;gap:8px;align-items:center}
  .hint{font-size:11.5px;color:var(--steel-dim)}

  /* the status rail */
  .rail{width:216px;flex:none;border-left:1px solid var(--line);background:var(--sea-900);
    display:flex;flex-direction:column;min-height:0}
  .rail h2{margin:0;padding:12px 14px 10px;font-size:12px;letter-spacing:.5px;
    text-transform:uppercase;color:var(--steel-dim);border-bottom:1px solid var(--line)}
  .steps{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
  .step{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
  .step .pip{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;
    margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:10px;
    color:var(--sea-900);font-weight:700}
  .step.done .pip{background:var(--green);border-color:var(--green)}
  .step.now .pip{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(127,208,224,.18)}
  .step .t{font-size:13px;font-weight:600}
  .step.todo .t{color:var(--steel-dim);font-weight:500}
  .step .s{font:11px/1.5 ui-monospace,Menlo,monospace;color:var(--steel-dim)}
  .rail .acts{margin-top:auto;padding:12px 14px;border-top:1px solid var(--line);
    display:flex;flex-direction:column;gap:8px}
  .saved{font:11px/1.5 ui-monospace,Menlo,monospace;color:var(--steel-dim);padding:0 14px 10px}

  dialog{border:1px solid var(--line);border-radius:12px;background:var(--sea-800);color:inherit;
    padding:0;width:min(760px,94vw);max-height:88vh;box-shadow:0 24px 70px rgba(0,0,0,.55)}
  dialog::backdrop{background:rgba(4,20,26,.66)}
  .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .dh h3{margin:0;font-size:15px}
  .db{padding:16px 18px;overflow:auto;max-height:56vh}
  .db pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.6 ui-monospace,Menlo,monospace;
    color:var(--steel);background:var(--sea-900);border:1px solid var(--line);border-radius:var(--r);
    padding:13px 15px}
  .df{display:flex;gap:9px;padding:13px 18px;border-top:1px solid var(--line);flex-wrap:wrap}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--sea-700);
    border:1px solid var(--line);border-radius:var(--r);padding:9px 15px;font-size:13px;
    box-shadow:0 12px 40px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s;
    max-width:80vw;z-index:9}
  .toast.on{opacity:1}

  @media (max-width:1100px){ .rail{width:190px} .side{width:290px} }
  @media (max-width:900px){
    .stage{flex-direction:column;overflow:auto}
    .side,.rail{width:auto;border-left:0;border-top:1px solid var(--line)}
    iframe{min-height:48vh}
    .list{max-height:38vh}
    .rail .acts{margin-top:0}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="brand">
    <img src="/icons/favicon-48.png" alt="">
    <div>OceanSafe review<span>notes only, nothing changes</span></div>
  </div>

  <select id="surface" aria-label="Page to review"></select>
  <button class="btn" id="pick">Select element</button>
  <span class="grow"></span>
  <input type="text" id="who" placeholder="Your name" style="max-width:130px" aria-label="Your name">
</div>

<div class="stage">
  <iframe id="preview" title="Page being reviewed"></iframe>

  <div class="side">
    <div class="sel" id="sel"></div>
    <div class="list" id="list"></div>
    <div class="compose">
      <textarea id="msg" placeholder="What should change here?"></textarea>
      <div class="row">
        <button class="btn go" id="add">Add note</button>
        <span class="grow"></span>
        <span class="hint"><b>&#8984;&#8629;</b> add</span>
      </div>
    </div>
  </div>

  <div class="rail">
    <h2>Status</h2>
    <div class="steps" id="steps"></div>
    <div class="saved" id="saved"></div>
    <div class="acts">
      <button class="btn go wide" id="build">Build the prompt</button>
      <button class="btn wide" id="reopen" disabled>Open last prompt</button>
      <button class="btn sm wide" id="clear">Start over</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="dh">
    <h3>Your prompt is ready</h3>
    <span class="grow"></span>
    <span class="hint" id="dlgMeta"></span>
  </div>
  <div class="db"><pre id="out"></pre></div>
  <div class="df">
    <button class="btn go" id="email">Send it</button>
    <button class="btn" id="copy">Copy</button>
    <button class="btn" id="dl">Download</button>
    <span class="grow"></span>
    <button class="btn" id="close">Close</button>
  </div>
</dialog>

<form name="os-review" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="bot-field">
  <input type="text" name="who">
  <input type="text" name="counts">
  <textarea name="prompt"></textarea>
  <textarea name="notes"></textarea>
</form>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id)
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const KEY = 'osreview.v2'
const MAILTO = 'mossmankauai@gmail.com'

// The surfaces worth reviewing. The dashboard is one file and five segments,
// and the segment comes from the route.
const SURFACES = [
  ['Guest app',                '/',           'index.html'],
  ['Plan tab',                 '/plan.html',  'plan.html'],
  ['Guest guide (co-branded)', '/stay-close-v2?ref=your-resort&seg=renter', 'stay-close-v2.html'],
  ['Dashboard: Hotel',         '/hotel',      'dashboard.html (seg hotel)'],
  ['Dashboard: Timeshare',     '/timeshare',  'dashboard.html (seg timeshare)'],
  ['Dashboard: Rentals',       '/rental',     'dashboard.html (seg pm)'],
  ['Dashboard: Concierge',     '/concierge',  'dashboard.html (seg concierge)'],
  ['Dashboard: Fleet',         '/fleet',      'dashboard.html (seg cars)'],
]
const fileFor = url => (SURFACES.find(s => s[1] === url) || [,, 'unknown'])[2]

let state = { notes: [], who: '', prompt: '', builtAt: '', sentAt: '', sentHow: '', savedAt: '' }
let picked = null, picking = false

try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')) } catch {}
// Carry over anything left by the first version of this page.
try {
  const old = JSON.parse(localStorage.getItem('osreview.notes.v1') || '[]')
  if (old.length && !state.notes.length) state.notes = old
} catch {}

function save(){
  state.savedAt = new Date().toISOString()
  try { localStorage.setItem(KEY, JSON.stringify(state)) } catch {}
  renderRail()
}

let toastTimer
function toast(t){
  const el = $('toast')
  el.textContent = t; el.classList.add('on')
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 3400)
}
const when = iso => iso ? new Date(iso).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : ''

// ---------- the page under review ----------
$('surface').innerHTML = SURFACES.map(([label, url]) =>
  `<option value="${esc(url)}">${esc(label)}</option>`).join('')

function load(){
  picked = null; showSel()
  $('preview').src = $('surface').value
}
$('surface').onchange = load

// Same origin, so the picker can be dropped straight into the page. It reads the
// page and reports what was clicked. It never writes to it.
$('preview').addEventListener('load', () => {
  try {
    const doc = $('preview').contentDocument
    if (!doc) return
    const s = doc.createElement('script')
    s.src = '/review-inspect.js'
    doc.documentElement.appendChild(s)
  } catch {
    toast('Cannot read that page from here. Pick another one.')
  }
})

window.addEventListener('message', e => {
  const m = e.data
  if (!m || m.source !== 'osed') return
  if (m.kind === 'pick'){
    picked = m; picking = false
    $('pick').classList.remove('on')
    showSel(); $('msg').focus()
  }
  if (m.kind === 'mode'){
    picking = m.active
    $('pick').classList.toggle('on', picking)
  }
  if (m.kind === 'clear'){ picked = null; showSel() }
})

function tellFrame(msg){
  const w = $('preview').contentWindow
  if (w) w.postMessage(Object.assign({source:'osed-shell'}, msg), '*')
}

$('pick').onclick = () => {
  picking = !picking
  $('pick').classList.toggle('on', picking)
  tellFrame({kind:'setActive', active: picking})
}

function showSel(){
  $('sel').innerHTML = picked
    ? `Selected <b>${esc(picked.label)}</b>` +
      `<button class="btn sm" id="unpick">Clear</button>`
    : `Hit <b>Select element</b>, then click the part of the page you want to talk about. ` +
      `A note with nothing selected is about the whole page.`
  const u = $('unpick')
  if (u) u.onclick = () => { picked = null; tellFrame({kind:'setActive', active:false}); showSel() }
}

// ---------- notes ----------
function renderNotes(){
  $('list').innerHTML = ''
  if (!state.notes.length){
    const d = document.createElement('div')
    d.className = 'empty'
    d.textContent = 'No notes yet. Click a part of the page, say what should change, and it lands here.'
    return $('list').appendChild(d)
  }
  state.notes.slice().reverse().forEach(n => {
    const i = state.notes.indexOf(n)
    const d = document.createElement('div')
    d.className = 'note'
    d.innerHTML = `<div class="txt">${esc(n.text)}</div>` +
      `<div class="meta">${esc(n.pageLabel)}${n.label ? ' · ' + esc(n.label) : ''}</div>`
    const b = document.createElement('button')
    b.className = 'del'; b.textContent = 'Delete'
    b.onclick = () => { state.notes.splice(i, 1); save(); renderNotes() }
    d.appendChild(b)
    $('list').appendChild(d)
  })
}

function add(){
  const text = $('msg').value.trim()
  if (!text) return toast('Type the note first')
  state.notes.push({
    text,
    pageLabel: $('surface').selectedOptions[0].textContent,
    page: $('surface').value,
    file: fileFor($('surface').value),
    label: picked?.label || '',
    selector: picked?.selector || '',
    at: new Date().toISOString(),
  })
  // A new note means the last prompt no longer covers everything.
  state.prompt = ''; state.builtAt = ''; state.sentAt = ''
  save(); renderNotes()
  $('msg').value = ''
  toast('Note added')
}
$('add').onclick = add
$('msg').addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') add()
})

$('who').value = state.who || ''
$('who').addEventListener('change', () => { state.who = $('who').value.trim(); save() })

// ---------- the status rail ----------
function renderRail(){
  const n = state.notes.length
  const steps = [
    { t: 'Notes',   s: n ? n + (n === 1 ? ' note' : ' notes') : 'none yet', done: n > 0 },
    { t: 'Prompt',  s: state.builtAt ? 'built ' + when(state.builtAt) : 'not built', done: !!state.prompt },
    { t: 'Saved',   s: state.savedAt ? 'in this browser' : 'nothing yet', done: !!state.savedAt && n > 0 },
    { t: 'Sent',    s: state.sentAt ? when(state.sentAt) + (state.sentHow === 'email fallback' ? ', by email' : '') : 'not yet', done: !!state.sentAt },
  ]
  const firstOpen = steps.findIndex(x => !x.done)
  $('steps').innerHTML = steps.map((x, i) =>
    `<div class="step ${x.done ? 'done' : i === firstOpen ? 'now' : 'todo'}">` +
    `<span class="pip">${x.done ? '&#10003;' : ''}</span>` +
    `<span><span class="t">${x.t}</span><br><span class="s">${esc(x.s)}</span></span></div>`).join('')

  $('saved').textContent = state.savedAt ? 'Autosaved ' + when(state.savedAt) : ''
  $('build').disabled = !n
  $('reopen').disabled = !state.prompt
  $('build').textContent = state.prompt ? 'Rebuild the prompt' : 'Build the prompt'
}

// ---------- the prompt ----------
// What Nick receives: the requests, where they land, and the rules the change has
// to survive. He reviews it, edits it, and only then does anything get applied.
function buildPrompt(){
  const who = state.who || 'a collaborator'
  const byFile = {}
  for (const n of state.notes) (byFile[n.file] = byFile[n.file] || []).push(n)
  const fileCount = Object.keys(byFile).length

  const L = []
  L.push(`Apply the review below to the OceanSafe site.`)
  L.push(``)
  L.push(`From ${who}, ${state.notes.length} request${state.notes.length === 1 ? '' : 's'} across ${fileCount} file${fileCount === 1 ? '' : 's'}, collected in the review tool.`)
  L.push(``)
  L.push(`## Before you touch anything`)
  L.push(``)
  L.push(`- Work on a branch: git switch -c work/review-<today>. Never on main.`)
  L.push(`- Tag the starting point first: git tag -f review-restore. One line undoes the lot:`)
  L.push(`  git reset --hard review-restore`)
  L.push(`- These files are single-file HTML and several hundred KB. Grep for the markup and`)
  L.push(`  read at an offset. Never read one whole.`)
  L.push(``)
  L.push(`## The requests`)
  for (const [file, notes] of Object.entries(byFile)){
    L.push(``)
    L.push(`### ${file}`)
    for (const n of notes){
      L.push(``)
      L.push(`- ${n.text}`)
      if (n.selector){
        L.push(`  - Element: ${n.label}`)
        L.push(`  - Selector: ${n.selector}`)
      } else {
        L.push(`  - Nothing was selected. This is about the page as a whole.`)
      }
      L.push(`  - Seen at: ${n.page}`)
    }
  }
  L.push(``)
  L.push(`## Rules the change has to survive`)
  L.push(``)
  L.push(`1. Change the element named and the CSS or JS that belongs to it. Nothing else.`)
  L.push(`2. Do not reformat, re-indent or tidy surrounding code. Each diff reads as one idea.`)
  L.push(`3. dashboard.html is one file and five segments. Anything outside window.OS_SEGMENTS`)
  L.push(`   hits all five, so say so out loud when a change is shared.`)
  L.push(`4. No em dashes or en dashes in any copy. No emoji as an interface icon, SVG only.`)
  L.push(`5. Islands are Kaua'i, Maui, O'ahu and Hawai'i Island. No efficacy or impact numbers.`)
  L.push(`6. If index.html changed, sw.js CACHE_VERSION has to be bumped or no guest sees it.`)
  L.push(`7. Do not deploy. Stop when the branch is ready.`)
  L.push(``)
  L.push(`## When you are done`)
  L.push(``)
  L.push(`- List each request and what you changed for it, one line each.`)
  L.push(`- Name anything you could not do, and why, rather than doing something near it.`)
  L.push(`- Flag any change that reached shared code.`)
  L.push(`- Then run these and paste the real output:`)
  L.push(`  /code-review high`)
  L.push(`  python3 ~/.claude/oceansafe-standards/checks/oscheck.py --type <web|console> --segment <seg> --paid|--free <file>`)
  L.push(``)
  return L.join('\n')
}

$('build').onclick = () => {
  if (!state.notes.length) return toast('Add a note first')
  state.prompt = buildPrompt()
  state.builtAt = new Date().toISOString()
  state.sentAt = ''; state.sentHow = ''
  save()
  openDlg()
}
$('reopen').onclick = openDlg
$('close').onclick = () => $('dlg').close()

function openDlg(){
  $('out').textContent = state.prompt
  $('dlgMeta').textContent = state.notes.length + ' notes · built ' + when(state.builtAt)
  $('dlg').showModal()
}

$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(state.prompt); toast('Prompt copied') }
  catch { toast('Select the text and copy it') }
}

$('dl').onclick = () => {
  const blob = new Blob([state.prompt], {type: 'text/markdown'})
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = 'oceansafe-review-' + new Date().toISOString().slice(0, 10) + '.md'
  a.click()
  setTimeout(() => URL.revokeObjectURL(a.href), 1000)
}

// Send posts the prompt to the site itself. No mail client in the path, and the
// status only says sent when the server actually took it.
$('email').onclick = async () => {
  const b = $('email')
  b.disabled = true; b.textContent = 'Sending...'
  try { await navigator.clipboard.writeText(state.prompt) } catch {}

  const form = new URLSearchParams({
    'form-name': 'os-review',
    'bot-field': '',
    who: state.who || 'a collaborator',
    counts: state.notes.length + ' notes',
    prompt: state.prompt,
    notes: JSON.stringify(state.notes, null, 2),
  })

  try {
    const r = await fetch('/review', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: form.toString(),
    })
    if (!r.ok) throw new Error('status ' + r.status)
    state.sentAt = new Date().toISOString()
    state.sentHow = 'delivered'
    save()
    b.textContent = 'Sent'
    toast('Sent. Nick has it, and it is on your clipboard too.')
    return
  } catch {
    // Falling back rather than losing the work: the prompt is already copied.
    state.sentAt = new Date().toISOString()
    state.sentHow = 'email fallback'
    save()
    b.disabled = false; b.textContent = 'Send it'
    const subject = 'OceanSafe review from ' + (state.who || 'a collaborator') +
      ' (' + state.notes.length + ')'
    const body = state.prompt.length > 1400
      ? state.prompt.slice(0, 1400) + '\n\n[...full prompt is on your clipboard, paste it here]'
      : state.prompt
    window.location.href = 'mailto:' + MAILTO +
      '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body)
    toast('Could not reach the server. Opening your email instead.')
  }
}

$('clear').onclick = () => {
  if (!state.notes.length && !state.prompt) return
  if (!confirm('Delete every note and the prompt on this browser?')) return
  state = { notes: [], who: state.who, prompt: '', builtAt: '', sentAt: '', sentHow: '', savedAt: '' }
  save(); renderNotes()
  toast('Cleared')
}

// Notes live in this browser until they are sent. Closing the tab with unsent
// ones is the one way to lose them, so say so.
window.addEventListener('beforeunload', e => {
  if (!state.notes.length || state.sentAt) return
  e.preventDefault()
  e.returnValue = ''
})

renderNotes()
renderRail()
showSel()
load()
</script>
</body>
</html>
