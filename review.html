<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08222b">
<title>OceanSafe review</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
  :root{
    --sea-900:#08222b; --sea-800:#0a2731; --sea-700:#0f3b48; --deep:#0b6e8f;
    --line:rgba(200,229,238,.16); --ink:#eaf6fa; --steel:#9dc0cc; --steel-dim:#6d919e;
    --cyan:#7fd0e0; --gold:#c9a84c; --green:#4fb286; --r:8px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--sea-900);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  button,select,input,textarea{font:inherit;color:inherit}

  .bar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--sea-800);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;white-space:nowrap}
  .brand img{width:26px;height:26px;border-radius:6px}
  .brand span{display:block;font:10px/1.3 ui-monospace,Menlo,monospace;color:var(--steel-dim);
    font-weight:400;letter-spacing:.4px;text-transform:uppercase}
  .grow{flex:1}
  select{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);
    background:var(--sea-900);font-weight:600;max-width:230px}
  select:focus{outline:none;border-color:var(--deep)}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r);
    border:1px solid var(--line);background:var(--sea-700);cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--deep)}
  .btn.on{background:var(--deep);border-color:var(--cyan);color:#fff}
  .btn.go{background:var(--deep);border-color:var(--deep);color:#fff;font-weight:600}
  .btn.go:hover{background:#0c81a4}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .count{font:11px/1 ui-monospace,Menlo,monospace;color:var(--gold)}

  .stage{flex:1;display:flex;min-height:0}
  iframe{flex:1;border:0;background:#fff;min-width:0}

  .side{width:340px;flex:none;border-left:1px solid var(--line);background:var(--sea-800);
    display:flex;flex-direction:column;min-height:0}
  .sel{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--steel);
    min-height:44px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sel b{color:var(--cyan);font:600 12px/1.4 ui-monospace,Menlo,monospace}
  .list{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .note{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--r);
    padding:9px 11px;background:rgba(201,168,76,.06)}
  .note .txt{white-space:pre-wrap}
  .note .meta{font:11px/1.5 ui-monospace,Menlo,monospace;color:var(--steel-dim);margin-top:5px}
  .note .del{margin-top:6px;font-size:12px;color:var(--steel-dim);background:none;border:0;
    padding:0;cursor:pointer;text-decoration:underline}
  .empty{color:var(--steel-dim);font-size:13px;padding:6px 2px}
  .compose{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:9px}
  textarea{width:100%;min-height:78px;resize:vertical;padding:9px 11px;border-radius:var(--r);
    border:1px solid var(--line);background:var(--sea-900)}
  textarea:focus{outline:none;border-color:var(--deep)}
  .row{display:flex;gap:8px;align-items:center}
  .hint{font-size:11.5px;color:var(--steel-dim)}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--sea-700);
    border:1px solid var(--line);border-radius:var(--r);padding:9px 15px;font-size:13px;
    box-shadow:0 12px 40px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s;
    max-width:80vw}
  .toast.on{opacity:1}

  @media (max-width:820px){
    .stage{flex-direction:column}
    .side{width:auto;border-left:0;border-top:1px solid var(--line);max-height:52vh}
    iframe{min-height:44vh}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="brand">
    <img src="/icons/favicon-48.png" alt="">
    <div>OceanSafe review<span>notes only, nothing changes</span></div>
  </div>

  <select id="surface" aria-label="Page to review"></select>
  <button class="btn" id="pick">Select element</button>
  <span class="grow"></span>
  <span class="count" id="count"></span>
  <button class="btn go" id="send">Send notes</button>
</div>

<div class="stage">
  <iframe id="preview" title="Page being reviewed"></iframe>

  <div class="side">
    <div class="sel" id="sel"></div>
    <div class="list" id="list"></div>
    <div class="compose">
      <textarea id="msg" placeholder="What should change here?"></textarea>
      <div class="row">
        <button class="btn go" id="add">Add note</button>
        <span class="grow"></span>
        <span class="hint"><b>&#8984;&#8629;</b> add</span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id)
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const KEY = 'osreview.notes.v1'
const MAILTO = 'mossmankauai@gmail.com'

// The surfaces worth reviewing. The dashboard is one file, five segments, and
// the segment comes from the route.
const SURFACES = [
  ['Guest app',  '/'],
  ['Plan tab',   '/plan.html'],
  ['Guest guide (co-branded)', '/stay-close-v2?ref=your-resort&seg=renter'],
  ['Dashboard: Hotel',     '/hotel'],
  ['Dashboard: Timeshare', '/timeshare'],
  ['Dashboard: Rentals',   '/rental'],
  ['Dashboard: Concierge', '/concierge'],
  ['Dashboard: Fleet',     '/fleet'],
]

let notes = []
let picked = null
let picking = false

try { notes = JSON.parse(localStorage.getItem(KEY) || '[]') } catch { notes = [] }

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(notes)) } catch {} }

let toastTimer
function toast(t){
  const el = $('toast')
  el.textContent = t; el.classList.add('on')
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 3200)
}

// ---------- the page under review ----------
$('surface').innerHTML = SURFACES.map(([label, url]) =>
  `<option value="${esc(url)}">${esc(label)}</option>`).join('')

function load(){
  picked = null; showSel()
  $('preview').src = $('surface').value
}
$('surface').onchange = load

// Same origin, so the picker can be dropped straight into the page. It reads the
// page and reports what was clicked. It never writes to it.
$('preview').addEventListener('load', () => {
  try {
    const doc = $('preview').contentDocument
    if (!doc) return
    const s = doc.createElement('script')
    s.src = '/review-inspect.js'
    doc.documentElement.appendChild(s)
  } catch (e) {
    toast('Cannot read that page from here. Pick another one.')
  }
})

window.addEventListener('message', e => {
  const m = e.data
  if (!m || m.source !== 'osed') return
  if (m.kind === 'pick'){
    picked = m
    picking = false
    $('pick').classList.remove('on')
    showSel()
    $('msg').focus()
  }
  if (m.kind === 'mode'){
    picking = m.active
    $('pick').classList.toggle('on', picking)
  }
  if (m.kind === 'clear'){ picked = null; showSel() }
})

function tellFrame(msg){
  const w = $('preview').contentWindow
  if (w) w.postMessage(Object.assign({source:'osed-shell'}, msg), '*')
}

$('pick').onclick = () => {
  picking = !picking
  $('pick').classList.toggle('on', picking)
  tellFrame({kind:'setActive', active: picking})
}

function showSel(){
  $('sel').innerHTML = picked
    ? `Selected <b>${esc(picked.label)}</b>` +
      `<button class="btn" id="unpick" style="padding:3px 9px;font-size:12px">Clear</button>`
    : `Hit <b>Select element</b>, then click the part of the page you want to talk about. ` +
      `A note without a selection is about the whole page.`
  const u = document.getElementById('unpick')
  if (u) u.onclick = () => { picked = null; tellFrame({kind:'setActive', active:false}); showSel() }
}

// ---------- notes ----------
function render(){
  $('count').textContent = notes.length ? notes.length + (notes.length === 1 ? ' note' : ' notes') : ''
  $('send').disabled = !notes.length
  $('list').innerHTML = ''
  if (!notes.length){
    const d = document.createElement('div')
    d.className = 'empty'
    d.textContent = 'No notes yet. They stay in this browser until you hit Send notes.'
    return $('list').appendChild(d)
  }
  notes.slice().reverse().forEach(n => {
    const i = notes.indexOf(n)
    const d = document.createElement('div')
    d.className = 'note'
    d.innerHTML = `<div class="txt">${esc(n.text)}</div>` +
      `<div class="meta">${esc(n.pageLabel)}${n.label ? ' · ' + esc(n.label) : ''}</div>`
    const b = document.createElement('button')
    b.className = 'del'; b.textContent = 'Delete'
    b.onclick = () => { notes.splice(i, 1); save(); render() }
    d.appendChild(b)
    $('list').appendChild(d)
  })
}

function add(){
  const text = $('msg').value.trim()
  if (!text) return toast('Type the note first')
  notes.push({
    text,
    pageLabel: $('surface').selectedOptions[0].textContent,
    page: $('surface').value,
    label: picked?.label || '',
    selector: picked?.selector || '',
    at: new Date().toISOString(),
  })
  save(); render()
  $('msg').value = ''
  toast('Note added')
}
$('add').onclick = add
$('msg').addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') add()
})

// ---------- sending ----------
function asText(){
  const lines = ['OceanSafe review notes', new Date().toLocaleString(), '']
  let last = ''
  for (const n of notes){
    if (n.pageLabel !== last){ lines.push('', n.pageLabel.toUpperCase()); last = n.pageLabel }
    lines.push(`- ${n.text}`)
    if (n.selector) lines.push(`  (${n.label} · ${n.selector})`)
  }
  return lines.join('\n')
}

$('send').onclick = async () => {
  const body = asText()
  try { await navigator.clipboard.writeText(body); toast('Copied. Opening your email now.') }
  catch { toast('Opening your email now.') }
  const url = 'mailto:' + MAILTO +
    '?subject=' + encodeURIComponent('OceanSafe review notes (' + notes.length + ')') +
    '&body=' + encodeURIComponent(body)
  setTimeout(() => { window.location.href = url }, 400)
}

// Notes live in this browser until they are sent. Closing the tab with unsent
// ones is the one way to lose them, so say so.
window.addEventListener('beforeunload', e => {
  if (!notes.length) return
  e.preventDefault()
  e.returnValue = ''
})

render()
showSel()
load()
</script>
</body>
</html>
