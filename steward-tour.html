<style>
:root{
  --bg:#f6f1e7;--card:#fffdf8;--ink:#0f3b49;--ink-2:#2e5568;--muted:#557280;
  --line:#e3dac7;--sea:#0e6e8c;--sea-tint:#e7f1f4;--gold:#c9a84c;--good:#17805a;
  --radius:16px;--shadow:0 1px 2px rgba(58,47,22,.05),0 10px 28px rgba(58,47,22,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:500;margin:0;line-height:1.15}
a{color:var(--sea)}
.top{background:#fffdf8;border-bottom:1px solid var(--line)}
.top .row{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:11px}
.top img{width:32px;height:32px;border-radius:8px}
.top .name{font-weight:800;font-size:15px}
.top .spacer{flex:1}
.top a{font-size:13.5px;font-weight:600}
.tour{max-width:1040px;margin:0 auto;padding:24px 20px 44px}
.panel{display:grid;grid-template-columns:340px 1fr;gap:28px;align-items:start}
@media(max-width:840px){.panel{grid-template-columns:1fr}}
.copy .step-n{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}
.copy h1{font-size:27px;margin:8px 0 10px}
.copy p{font-size:16px;color:var(--ink-2);margin:0}
.dots{display:flex;gap:8px;margin:22px 0}
.dots button{width:10px;height:10px;border-radius:50%;border:none;background:#d9cfb6;cursor:pointer;padding:0}
.dots button.on{background:var(--sea);transform:scale(1.15)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{border:none;border-radius:10px;padding:11px 16px;font:700 14.5px/1 inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sea{background:var(--sea);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.tryline{margin-top:16px;font-size:13.5px}
.stage{display:flex;justify-content:center;align-items:flex-start;min-height:560px}
.device{position:relative;transition:opacity .18s}
.device.loading{opacity:.5}
.device.phone{width:360px;max-width:100%;border:11px solid #0f2b30;border-radius:36px;background:#0f2b30;box-shadow:var(--shadow);overflow:hidden}
.device.phone iframe{width:100%;height:690px;border:none;display:block;background:#f6f1e7}
.device.laptop{width:900px;max-width:100%;border:1px solid #d7cdb5;border-radius:12px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.device.laptop .bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#efe7d6;border-bottom:1px solid var(--line)}
.device.laptop .bar i{width:10px;height:10px;border-radius:50%;background:#cbb98f;display:block}
.device.laptop .bar .u{margin-left:10px;font-size:11.5px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 9px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:70%}
.device.laptop iframe{width:100%;height:540px;border:none;display:block;background:#f6f1e7}
.shim{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s}
.device.loading .shim{opacity:1}
</style>
</head>

<div class="tour">
  <div class="panel">
    <div class="copy">
      <div class="step-n" id="stepN">Step 1 of 5</div>
      <h1 id="stepTitle">Your guide</h1>
      <p id="stepBody">…</p>
      <div class="dots" id="dots" role="tablist" aria-label="Tour steps"></div>
      <div class="controls">
        <button class="btn ghost" id="back">Back</button>
        <button class="btn sea" id="next">Next</button>
      </div>
      <div class="tryline"><a id="tryLink" href="#" target="_blank" rel="noopener">Open this yourself ↗</a></div>
    </div>
    <div class="stage">
      <div class="device phone" id="device">
        <div class="shim">Loading the live app…</div>
        <iframe id="frame" title="OceanSafe preview" src="about:blank" loading="eager"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var STEPS=[
    {kind:'phone', src:'steward.html?ref=steward-demo&island=kauai',
     title:'Your guide',
     body:'This is the OceanSafe beach app with your name on it — “In partnership with your nonprofit.” Same live conditions and hazard warnings everyone already relies on.'},
    {kind:'phone', src:'steward.html?ref=steward-demo&island=kauai&tour=1',
     title:'Everything in one tap',
     body:'Tap “Ways to help” and beachgoers see your upcoming cleanups, the beaches you care for, and your volunteer and donate buttons — all in one place.'},
    {kind:'laptop', src:'steward-console.html?view=impact',
     title:'Your dashboard',
     body:'This is your side. The Impact tab shows how many people opened your guide, read a safety warning, and used it to plan their day.'},
    {kind:'laptop', src:'steward-console.html?view=events',
     title:'Add a cleanup in seconds',
     body:'Add or edit an event and it shows up in the app, right where people are planning their beach day. No code, no waiting.'},
    {kind:'laptop', src:'steward-console.html?view=report',
     title:'One-click impact report',
     body:'When you need to show what you did — to your board, a funder, or the County — export it as a spreadsheet or a clean printout.'}
  ];
  var i=0, cur='';
  var frame=document.getElementById('frame'), device=document.getElementById('device');
  var dots=document.getElementById('dots');
  STEPS.forEach(function(s,idx){
    var b=document.createElement('button'); b.setAttribute('role','tab'); b.setAttribute('aria-label','Step '+(idx+1));
    b.addEventListener('click',function(){ go(idx); }); dots.appendChild(b);
  });
  frame.addEventListener('load', function(){ if(frame.getAttribute('src')!=='about:blank') device.classList.remove('loading'); });
  function render(){
    var s=STEPS[i];
    document.getElementById('stepN').textContent='Step '+(i+1)+' of '+STEPS.length;
    document.getElementById('stepTitle').textContent=s.title;
    document.getElementById('stepBody').textContent=s.body;
    document.getElementById('tryLink').setAttribute('href', s.src);
    device.className='device '+s.kind;
    Array.prototype.forEach.call(dots.children,function(d,idx){ d.className=(idx===i?'on':''); });
    document.getElementById('back').disabled=(i===0);
    var nx=document.getElementById('next'); nx.textContent=(i===STEPS.length-1)?'Start over':'Next';
    if(s.src!==cur){ cur=s.src; device.classList.add('loading'); frame.setAttribute('src', s.src); }
  }
  function go(n){ i=(n+STEPS.length)%STEPS.length; render(); }
  document.getElementById('next').addEventListener('click',function(){ go(i+1); });
  document.getElementById('back').addEventListener('click',function(){ if(i>0) go(i-1); });
  document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight') go(i+1); else if(e.key==='ArrowLeft'&&i>0) go(i-1); });
  render();
})();
</script>
