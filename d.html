<style>
  :root{
    --deep:oklch(0.34 0.055 218);--deep2:oklch(0.27 0.05 224);
    --teal:oklch(0.60 0.088 213);--teal-ink:oklch(0.44 0.08 214);
    --gold:oklch(0.80 0.12 84);--gold-d:oklch(0.72 0.13 74);
    --ink:oklch(0.27 0.02 232);--mute:oklch(0.52 0.02 232);
    --sand:oklch(0.975 0.009 84);--card:oklch(0.995 0.003 84);
    --line:oklch(0.91 0.012 220);--field:oklch(0.985 0.006 220);
    --accent:var(--teal);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--sand);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55;padding:0 0 64px}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}
  /* deep-teal header band (ties to the signup hero) */
  .dhead{margin:0 -16px 0;padding:22px 24px 30px;color:oklch(0.96 0.012 210);background:radial-gradient(130% 120% at 88% -25%,var(--teal) 0%,var(--deep) 52%,var(--deep2) 100%)}
  .mast{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;opacity:.95}
  .mast svg{width:20px;height:20px;flex:none}.mast .c{color:oklch(0.86 0.13 88)}
  .crumb{opacity:.62;font-weight:400}
  .shop{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:27px;letter-spacing:-.4px;margin-top:12px;line-height:1.08}
  .shopmeta{opacity:.78;font-size:14px;margin-top:4px}
  .privband{margin-top:16px;font-size:12.5px;color:oklch(0.9 0.02 205);opacity:.85;display:flex;gap:6px;align-items:center}
  .privband svg{width:13px;height:13px;flex:none;opacity:.8}
  .card{background:var(--card);border-radius:16px;padding:20px 20px 22px;margin-top:14px;box-shadow:0 1px 2px oklch(0.3 0.04 220 / .05), 0 14px 34px -22px oklch(0.34 0.05 220 / .3)}
  .card.lift{margin-top:-16px;position:relative;z-index:2}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700;margin-bottom:12px}
  h2 .t{font-size:16px;text-transform:none;letter-spacing:normal;color:var(--ink);font-weight:700}
  .btn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-weight:600;font-size:14px;text-decoration:none;border-radius:11px;padding:11px 16px;cursor:pointer;border:1px solid transparent;transition:transform .15s,box-shadow .15s,filter .15s}
  .btn.primary{background:linear-gradient(180deg,var(--teal),var(--teal-ink));color:#fff;box-shadow:0 8px 18px -12px oklch(0.44 0.08 214 / .9)}
  .btn.primary:hover{transform:translateY(-1px);filter:brightness(1.04)}
  .btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold-d));color:oklch(0.26 0.06 68);box-shadow:0 8px 18px -12px oklch(0.72 0.13 74 / .8)}
  .btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:oklch(0.8 0.03 214)}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .qr img{width:118px;height:118px;border:1px solid var(--line);border-radius:12px;background:#fff}
  /* town-ad printable assets — each carries the partner's own QR */
  .assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:16px;margin-top:16px}
  .asset{display:flex;flex-direction:column;align-items:center;text-align:center}
  .asset .thumb{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    background:oklch(0.955 0.01 84);border:1px solid var(--line);border-radius:12px;padding:9px;overflow:hidden}
  .asset .thumb img{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;
    border-radius:4px;box-shadow:0 4px 12px -6px oklch(0.3 0.05 220 / .35)}
  .asset .nm{font-weight:600;font-size:13px;margin-top:9px;line-height:1.25}
  .asset .sz{font-size:11.5px;color:var(--mute);margin-top:2px}
  .asset .btn{margin-top:8px}
  /* real app screenshot in the promotion card */
  .shot{flex:none;width:152px;border-radius:16px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 2px 5px oklch(0.3 0.04 220 / .07), 0 22px 44px -22px oklch(0.34 0.05 220 / .5)}
  .shot img{display:block;width:100%;height:auto}
  .kv{display:grid;grid-template-columns:128px 1fr;gap:9px 14px;font-size:14.5px}
  .kv .k{color:var(--mute)}
  .lead{font-size:14.5px;color:var(--ink);line-height:1.55}
  .hint{font-size:13px;color:var(--mute);margin-top:9px;line-height:1.5}
  .pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:oklch(0.955 0.01 84);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
  .pill.on{background:oklch(0.95 0.04 168);color:oklch(0.4 0.09 168);border-color:oklch(0.82 0.07 168)}
  .pill.gold{background:oklch(0.95 0.06 90);color:oklch(0.5 0.11 78);border-color:oklch(0.86 0.1 84)}
  .soonrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.soonrow:first-of-type{border-top:none}
  .empty{color:var(--mute);font-size:14px;background:oklch(0.965 0.008 84);border-radius:10px;padding:12px 14px;margin-top:12px}
  .dim{color:oklch(0.62 0.015 232)}
  a{color:var(--teal-ink);font-weight:500}
  input{font-family:inherit}
  /* self-serve promo form — mirrors the inline styling the items row already uses */
  .lbl{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin-bottom:4px}
  #promoTitle,#promoStart,#promoEnd,#promoExp,#promoFile{width:100%;font-size:14px;padding:9px 11px;border:1px solid #D5DCE2;border-radius:9px;background:#fff;color:inherit}
  #promoFile{padding:8px;background:oklch(0.975 0.006 84)}
  /* logo card — reuses the promo form's input styling so the two match */
  #logoFile{width:100%;font-size:14px;padding:8px;border:1px solid #D5DCE2;border-radius:9px;background:oklch(0.975 0.006 84);color:inherit}
  .logoprev{width:104px;height:104px;flex:0 0 auto;border:1px dashed #D5DCE2;border-radius:12px;background:#fff;
    display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:8px;overflow:hidden}
  .logoprev img{max-width:100%;max-height:100%;object-fit:contain}
  #logoMsg.err{color:oklch(0.52 0.17 27)}
  #logoMsg.ok{color:oklch(0.45 0.1 168)}
  #promoMsg.err{color:oklch(0.52 0.17 27)}
  #promoMsg.ok{color:oklch(0.45 0.1 168)}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--deep);color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 10px 30px -12px oklch(0.3 0.05 220 / .5)}
  #toast.show{opacity:1}
</style></head>

  //
  // errorCorrectionLevel "H" is LOAD-BEARING: the mark occludes the centre, and the library's
  // default ("M", 15% recovery) has too little budget to survive that plus a phone camera on a
  // creased thermal receipt. "H" recovers 30%.
  //
  // MARK_FRAC = 0.16. Measured cliff: at 0.22 the code still decoded in OpenCV but FAILED zbar
  // (the decoder behind many real scanners) — i.e. it would have looked fine in testing and failed
  // in the field. 0.20 was the last size passing both; 0.16 leaves headroom for the real world.
  // Verified at 0.16 on two independent decoders (zbar + OpenCV) under: downscale to 120px, focus
  // blur, faded thermal print, 8/12/20-degree rotation, and dim-light sensor noise — all pass.
  //
  // If the mark fails to load we resolve the PLAIN QR rather than nothing.
  const OS_MARK="/assets/oceansafe-favicon.png";
  const MARK_FRAC=0.16;
  function qrWithLogo(url,size){
    return new Promise((resolve,reject)=>{
      QRCode.toDataURL(url,{margin:1,width:size,errorCorrectionLevel:"H"},(e,qr)=>{
        if(e) return reject(e);
        const base=new Image();
        base.onload=()=>{
          const c=document.createElement("canvas"); c.width=c.height=size;
          const x=c.getContext("2d");
          x.drawImage(base,0,0,size,size);
          const mark=new Image();
          mark.onload=()=>{
            const s=Math.round(size*MARK_FRAC), o=Math.round((size-s)/2), pad=Math.round(s*0.14);
            const bx=o-pad, by=o-pad, bw=s+pad*2, bh=s+pad*2, br=Math.round(s*0.26);

            x.fill();
            x.drawImage(mark,o,o,s,s);
            resolve(c.toDataURL("image/png"));
          };
          mark.onerror=()=>resolve(qr);
          mark.src=OS_MARK;
        };
        base.onerror=()=>reject(new Error("qr render failed"));
        base.src=qr;
      });
    });
  }

        {key:"tent",    label:"Table tent",         w:1200,h:1800, sz:"4 × 6 in · folds", layout:"tent", cat:"counter"},
        {key:"sticker", label:"Window sticker",     w:900, h:900,  sz:"3 × 3 in",        layout:"square",cat:"general"},

    const SAND="#FBF8F2", DEEP="#0F3D49", TEAL="#0A8BA8", INK="#16202A", MUTE="#5B6B76", GOLD="#F0B429";

    const F=(w,s)=>w+" "+Math.round(s)+"px Inter,-apple-system,Segoe UI,system-ui,sans-serif";
    function wave(x,cx,cy,w,col){ x.strokeStyle=col; x.lineWidth=w*0.075; x.lineCap="round"; x.beginPath();

    // ship a header with a hole in it. A partner's assets must never depend on one PNG.
    function lockup(x,W,cy,iconSize,fontPx,markImg,waveFallbackW){
      if(!markImg){ wave(x,W/2,cy+iconSize*0.34,waveFallbackW,GOLD); return; }
      x.font=F(800,fontPx);
      const t="OceanSafe", tw=x.measureText(t).width, gap=iconSize*0.30;
      const sx=(W-(iconSize+gap+tw))/2;
      const _ta=x.textAlign, _tb=x.textBaseline;

      x.textAlign="left"; x.textBaseline="middle"; x.fillStyle="#fff";
      x.fillText(t,sx+iconSize+gap,cy);
      x.textAlign=_ta; x.textBaseline=_tb;
    }
    function drawAsset(spec,qrImg,markImg){
      const c=document.createElement("canvas"); c.width=spec.w; c.height=spec.h;

      // higher-version code (a long slug pushes the version up, shrinking the modules) that blur
      // plus the 16% centre mark was enough to make the code UNDECODABLE — verified: a
      // "test-timeshare" slug produced a bare QR that failed OpenCV at every scale from 1200px
      // down to 160px, while the shorter "test-hotel" slug decoded everywhere. A QR is
      // black-and-white geometry; nearest-neighbour is both correct and sharper. Never draw the
      // QR with plain drawImage — use this.
      const qr=(img,dx,dy,dw,dh)=>{ const s=x.imageSmoothingEnabled; x.imageSmoothingEnabled=false;
        x.drawImage(img,dx,dy,dw,dh); x.imageSmoothingEnabled=s; };

      // designed card. Also what a sign shop asks for when they're laying out their own artwork.
      // WHITE background, not SAND: thermal receipt printers threshold to pure black/white, and
      // a tinted quiet zone can dither into speckle that costs you the scan. The quiet zone is
      // ~8% a side — the QR spec's minimum is 4 modules, and below that scanners lose the finder
      // pattern against whatever it's printed beside.
      if(spec.layout==="bare"){

        // printed receipt ("Free Maui be…", "Your Beach Gril…"). Step each line down until it
        // fits its box. Sizes are a CEILING now, not a fixed value — long business names and
        // "Hawaiʻi Island" shrink to fit instead of running off the edge.

        // below is capped to it, or a long business name ends up dwarfing the headline it sits
        // under (which is what happens if each line is fitted independently).

        line("Free "+islandName+" beach guide",700,hs,pad+H*0.02,INK);
        line("Scan: today’s surf, wind, and",400,Math.min(H*0.093,hs*0.74),pad+H*0.24,MUTE);
        line("which beaches are calm.",400,Math.min(H*0.093,hs*0.74),pad+H*0.37,MUTE);
        line(p.name.slice(0,26),700,Math.min(H*0.10,hs*0.8),pad+H*0.58,brand);
        return c;
      }

        x.fillStyle=DEEP; x.fillRect(0,0,W,H*0.26);
        x.textAlign="center";

        const q=W*0.52; x.fillStyle="#fff"; x.fillRect(W/2-q/2-W*0.02,H*0.33,q+W*0.04,q+W*0.04);
        qr(qrImg,W/2-q/2,H*0.34,q,q);
        x.fillStyle=INK; x.font=F(700,W*0.062); x.fillText("Free beach guide",W/2,H*0.885);
        x.fillStyle=brand; x.font=F(600,W*0.042); x.fillText(p.name.slice(0,30),W/2,H*0.945);
        x.textAlign="left"; return c;
      }

      const band=H*0.145; x.fillStyle=DEEP; x.fillRect(0,0,W,band);
      x.textAlign="center";
      lockup(x,W,band*0.5,W*0.085,W*0.062,markImg,W*0.20);
      x.fillStyle=INK; x.font=F(800,W*0.075); x.fillText("Free "+islandShort,W/2,band+H*0.045);
      x.fillText("beach guide",W/2,band+H*0.088);
      x.fillStyle=MUTE; x.font=F(400,W*0.038);
      x.fillText("Today’s surf, wind, and which",W/2,band+H*0.142);
      x.fillText("beaches are calm right now.",W/2,band+H*0.172);

      x.fillStyle=TEAL; x.font=F(700,W*0.040); x.fillText("Scan with your phone camera",W/2,qy+q+W*0.055);
      const fy=qy+q+W*0.115;
      x.fillStyle=brand; x.font=F(800,W*0.052); x.fillText(p.name.slice(0,28),W/2,fy);
      x.fillStyle=MUTE; x.font=F(400,W*0.032); x.fillText("oceansafety.app",W/2,fy+W*0.068);
      if(spec.layout==="tent"){                     // fold guide
        x.strokeStyle="#C9D4DA"; x.lineWidth=2; x.setLineDash([12,10]);
        x.beginPath(); x.moveTo(0,H*0.5); x.lineTo(W,H*0.5); x.stroke(); x.setLineDash([]);
        x.fillStyle="#9AA9B2"; x.font=F(400,W*0.026); x.fillText("fold here",W/2,H*0.5+W*0.012);
      }
      x.textAlign="left"; return c;
    }
    // The header lockup needs the real mark as a loaded image. Resolve it alongside the QR and
    // NEVER let it block: if the icon 404s we resolve null and drawAsset falls back to the drawn
    // wave. A missing logo must not cost the partner their printable assets.
    const markReady = new Promise(resolve=>{
      const m=new Image(); m.onload=()=>resolve(m); m.onerror=()=>resolve(null); m.src=OS_MARK;
    });
    // One QR per distinct placement, not one for the whole set: an in-room card and a lobby sign
    // must carry different ?qr= values or the scan counts land in the wrong bucket and the
    // "which spot brings the most scans" promise on the QR card above is a lie.
    const fail=()=>{ const g=document.getElementById("assetGrid");
      if(g) g.innerHTML='<span class="dim">Couldn’t build your assets — email us and we’ll send them over.</span>'; };
    const load=src=>new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; });
    const cats=[...new Set(ASSETS.map(a=>a.cat))];
    Promise.all([Promise.all(cats.map(c=>qrWithLogo(qrUrl(c),1400).then(load))), markReady]).then(([imgs,markImg])=>{
      const grid=document.getElementById("assetGrid"); if(!grid) return;
      const qrFor={}; cats.forEach((c,i)=>{ qrFor[c]=imgs[i]; });
      grid.innerHTML="";
      ASSETS.forEach(spec=>{
        let png; try{ png=drawAsset(spec,qrFor[spec.cat],markImg).toDataURL("image/png"); }catch(_){ return; }
        const d=document.createElement("div"); d.className="asset";
        d.innerHTML='<div class="thumb"><img alt="'+esc(spec.label)+' with your QR code" src="'+png+'"></div>'
          +'<div class="nm">'+esc(spec.label)+'</div><div class="sz">'+esc(spec.sz)+'</div>'
          +'<a class="btn ghost sm" download="'+esc(p.slug)+'-'+spec.key+'.png" href="'+png+'">Download</a>';
        grid.appendChild(d);
      });
    }).catch(fail);
  }
})();
</script>
</body></html>
