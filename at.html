<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OceanSafe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A8BA8'/%3E%3Cpath d='M6 41c6 0 6-8 12-8s6 8 12 8 6-8 12-8 6 8 12 8' fill='none' stroke='%23FFC64B' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#0c4a58;color:#cfe8ee;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;font-size:15px}</style>
</head><body>
<div>Opening the guide&hellip;</div>
<script>
// Vanity creator links: oceansafety.app/@handle → the creator's full link, routed to the
// island their guide covers (read from their co-brand config; falls back gracefully).
(function(){
  var m = location.pathname.match(/^\/@([A-Za-z0-9]{1,29})\/?$/);
  if(!m){ location.replace('/creators.html'); return; }
  var slug = 'cr-' + m[1].toLowerCase();
  var done = false;
  function go(isl){
    if(done) return; done = true;
    location.replace('/?' + (isl ? 'island=' + isl + '&' : '') + 'ref=' + slug);
  }
  setTimeout(function(){ go(''); }, 2500);   // never strand the visitor on a slow config read
  fetch('https://concierge-guide-api.oceansafe-hi.workers.dev/cfg/' + slug)
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(cfg){ go(cfg && cfg.islands ? Object.keys(cfg.islands)[0] : ''); })
    .catch(function(){ go(''); });
})();
</script>
</body></html>
