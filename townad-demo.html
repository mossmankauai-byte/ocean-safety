<style>
  :root{
    --deep:oklch(0.34 0.055 218);--deep2:oklch(0.27 0.05 224);
    --teal:oklch(0.60 0.088 213);--teal-ink:oklch(0.44 0.08 214);
    --gold:oklch(0.80 0.12 84);--gold-d:oklch(0.72 0.13 74);
    --ink:oklch(0.27 0.02 232);--mute:oklch(0.52 0.02 232);
    --sand:oklch(0.975 0.009 84);--card:oklch(0.995 0.003 84);
    --line:oklch(0.91 0.012 220);--field:oklch(0.985 0.006 220);
    --accent:var(--teal);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--sand);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55;padding:0 0 64px}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}
  /* deep-teal header band (ties to the signup hero) */
  .dhead{margin:0 -16px 0;padding:22px 24px 30px;color:oklch(0.96 0.012 210);background:radial-gradient(130% 120% at 88% -25%,var(--teal) 0%,var(--deep) 52%,var(--deep2) 100%)}
  .mast{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;opacity:.95}
  .mast svg{width:20px;height:20px;flex:none}.mast .c{color:oklch(0.86 0.13 88)}
  .crumb{opacity:.62;font-weight:400}
  .shop{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:27px;letter-spacing:-.4px;margin-top:12px;line-height:1.08}
  .shopmeta{opacity:.78;font-size:14px;margin-top:4px}
  .privband{margin-top:16px;font-size:12.5px;color:oklch(0.9 0.02 205);opacity:.85;display:flex;gap:6px;align-items:center}
  .privband svg{width:13px;height:13px;flex:none;opacity:.8}
  .card{background:var(--card);border-radius:16px;padding:20px 20px 22px;margin-top:14px;box-shadow:0 1px 2px oklch(0.3 0.04 220 / .05), 0 14px 34px -22px oklch(0.34 0.05 220 / .3)}
  .card.lift{margin-top:-16px;position:relative;z-index:2}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700;margin-bottom:12px}
  h2 .t{font-size:16px;text-transform:none;letter-spacing:normal;color:var(--ink);font-weight:700}
  .btn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-weight:600;font-size:14px;text-decoration:none;border-radius:11px;padding:11px 16px;cursor:pointer;border:1px solid transparent;transition:transform .15s,box-shadow .15s,filter .15s}
  .btn.primary{background:linear-gradient(180deg,var(--teal),var(--teal-ink));color:#fff;box-shadow:0 8px 18px -12px oklch(0.44 0.08 214 / .9)}
  .btn.primary:hover{transform:translateY(-1px);filter:brightness(1.04)}
  .btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold-d));color:oklch(0.26 0.06 68);box-shadow:0 8px 18px -12px oklch(0.72 0.13 74 / .8)}
  .btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:oklch(0.8 0.03 214)}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .qr img{width:118px;height:118px;border:1px solid var(--line);border-radius:12px;background:#fff}
  /* town-ad printable assets — each carries the partner's own QR */
  .assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:16px;margin-top:16px}
  .asset{display:flex;flex-direction:column;align-items:center;text-align:center}
  .asset .thumb{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    background:oklch(0.955 0.01 84);border:1px solid var(--line);border-radius:12px;padding:9px;overflow:hidden}
  .asset .thumb img{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;
    border-radius:4px;box-shadow:0 4px 12px -6px oklch(0.3 0.05 220 / .35)}
  .asset .nm{font-weight:600;font-size:13px;margin-top:9px;line-height:1.25}
  .asset .sz{font-size:11.5px;color:var(--mute);margin-top:2px}
  .asset .btn{margin-top:8px}
  /* real app screenshot in the promotion card */
  .shot{flex:none;width:152px;border-radius:16px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 2px 5px oklch(0.3 0.04 220 / .07), 0 22px 44px -22px oklch(0.34 0.05 220 / .5)}
  .shot img{display:block;width:100%;height:auto}
  .kv{display:grid;grid-template-columns:128px 1fr;gap:9px 14px;font-size:14.5px}
  .kv .k{color:var(--mute)}
  .lead{font-size:14.5px;color:var(--ink);line-height:1.55}
  .hint{font-size:13px;color:var(--mute);margin-top:9px;line-height:1.5}
  .pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:oklch(0.955 0.01 84);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
  .pill.on{background:oklch(0.95 0.04 168);color:oklch(0.4 0.09 168);border-color:oklch(0.82 0.07 168)}
  .pill.gold{background:oklch(0.95 0.06 90);color:oklch(0.5 0.11 78);border-color:oklch(0.86 0.1 84)}
  .soonrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.soonrow:first-of-type{border-top:none}
  .empty{color:var(--mute);font-size:14px;background:oklch(0.965 0.008 84);border-radius:10px;padding:12px 14px;margin-top:12px}
  .dim{color:oklch(0.62 0.015 232)}
  a{color:var(--teal-ink);font-weight:500}
  input{font-family:inherit}
  /* self-serve promo form — mirrors the inline styling the items row already uses */
  .lbl{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin-bottom:4px}
  #promoTitle,#promoStart,#promoEnd,#promoExp,#promoFile{width:100%;font-size:14px;padding:9px 11px;border:1px solid #D5DCE2;border-radius:9px;background:#fff;color:inherit}
  #promoFile{padding:8px;background:oklch(0.975 0.006 84)}
  #promoMsg.err{color:oklch(0.52 0.17 27)}
  #promoMsg.ok{color:oklch(0.45 0.1 168)}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--deep);color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 10px 30px -12px oklch(0.3 0.05 220 / .5)}
  #toast.show{opacity:1}
</style></head>

<div style="background:#F0B429;color:#0c333d;font:600 13.5px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;padding:9px 14px;text-align:center">

<script>

/* ── SAMPLE DASHBOARD — generated by scripts/build-townad-demo.py, do not hand-edit ──

}],error:null})};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ml=(s,b)=>"mailto:"+NICK+"?subject="+encodeURIComponent(s)+"&body="+encodeURIComponent(b);
const m=location.pathname.match(/\/d\/([^/?#]+)/);
const token=(m?m[1]:new URLSearchParams(location.search).get("t")||"sample");  // DEMO

window.copy=t=>navigator.clipboard&&navigator.clipboard.writeText(t).then(toast);
function renewal(paid){const d=paid?new Date(paid):null;if(!d||isNaN(d))return null;d.setFullYear(d.getFullYear()+1);return d.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"})}
(async()=>{
  const root=document.getElementById("root");
  if(!token){root.innerHTML='<div class="card"><div class="dim">Invalid dashboard link.</div></div>';return;}
  const {data,error}=await sb.rpc("get_partner_dashboard",{p_token:token});
  const p=Array.isArray(data)?data[0]:null;
  if(error||!p){root.innerHTML='<div class="card"><h2>Dashboard not found</h2><div class="lead">This link looks wrong. Check the link in your welcome email, or <a href="mailto:'+NICK+'">email us</a>.</div></div>';return;}
  const primary="#"+(p.primary_hex||"0a8ba8").replace(/^#/,"");
  const live=SITE+"/go/"+_ISL;   // DEMO: query-free base — see build-townad-demo.py
  const seg=p.segment;

  const ISLAND_LABEL={kauai:["Kauaʻi","Kauaʻi"],maui:["Maui","Maui"],oahu:["Oʻahu","Oʻahu"],hawaii:["Hawaiʻi Island","Hawaiʻi"]};

  // render a broken image; Hawaiʻi has none yet (not live). Add a key when its capture lands.
  // MUST be declared up here, above the root.innerHTML build: that build calls promoCard() ->
  // phonePreview(), and `const` is not hoisted — declaring it next to phonePreview put it in the
  // temporal dead zone at call time and threw ReferenceError, killing the whole town_ad dashboard.
  const PROMO_SHOT_ISLANDS = { kauai:1, maui:1, oahu:1 };
  // Town-filter labels for the "Your pin" card. Up HERE with the other island constants for the
  // same reason PROMO_SHOT_ISLANDS is: the root.innerHTML build calls pinCard() long before this
  // point in the file, and `const` is not hoisted — declaring it next to pinCard() puts it in the
  // temporal dead zone at call time and kills the whole dashboard. That exact bug already shipped
  // once (6615bb8). Keys mirror partners_category_chk (0028) and SUBTABS.shopping.
  const CAT_LABEL = { food:"Restaurant / food", drinks:"Bar / drinks", coffee:"Coffee",
                      farmers:"Farmers market", crafts:"Shop / crafts / gifts",
                      grocery:"Grocery / market", gas:"Gas / convenience" };
  const isTownAd = seg==="town_ad";
  const isOperator = seg==="hotel"||seg==="pm"||seg==="timeshare"||seg==="rental"||seg==="retail";
  const isFree = Number(p.monthly_cents||0)===0;
  const noun = seg==="hotel"?"Hotel" : seg==="timeshare"?"Club" : seg==="pm"?"Property" : seg==="rental"?"Business" : seg==="retail"?"Store" : isTownAd?"Business" : "Shop";
  const planTerms = isTownAd
    ? "Town Ad, $50/mo flat. Your listing, printable QRs, a timed promotion, and this dashboard. Billed monthly through Square, cancel anytime. No cut of what you sell at the register."
    : isOperator
    ? (isFree
        ? (seg==="retail" ? "OceanSafe for Retail — Free. $0/mo; OceanSafe takes 3% only on app sales (you keep 97%). Your page, QR codes, and analytics included."
          : seg==="rental" ? "OceanSafe for Rentals & Tours — Free to join. Tour commissions split 50/50; 12.7% on store sales (you keep 87.3%). Your page, QR codes, and analytics included."
          : "OceanSafe for "+(seg==="hotel"?"Hotels":"Operators")+" — Free. The co-branded guide, your QR codes, and your analytics at no cost.")
        : "$"+Math.round((p.monthly_cents||0)/100)+"/mo flat — the whole property: all co-branding, promotions, and unlimited amenities. No per-room, no per-booking.")
    : "Storefront — Free: $0/mo + 3% only on in-app sales (you keep 97%) · or $500/store/mo with 0%. Square's card processing (~3.3% + 30¢) is your own cost as merchant of record — we don't mark it up.";
  const renews = isOperator && isFree ? null : renewal(p.paid_at);
  const ams=(Array.isArray(p.amenities)?p.amenities:[]).map(a=>a&&a.name?a.name:a).filter(Boolean);
  const qrCats = seg==="hotel"?[["room","In-room card"],["lobby","Lobby / front desk"],["welcome_email","Welcome email"],["general","Your own signage"]]
    : (seg==="pm"||seg==="timeshare")?[["unit","In each unit"],["welcome_email","Welcome email"],["general","Your signage"]]
    : isTownAd?[["receipt","Counter & receipt QR"]]
    : [["counter","Counter card"],["receipt","Receipt"],["general","Your signage"]];
  const qrUrl=cat=>live+"?ref="+encodeURIComponent(p.slug)+"&qr="+cat;
  const sells = seg==="retail"||seg==="rental"||(!isOperator && !isTownAd);   // segments that list store items
  const keepPct = seg==="retail"?"97%":seg==="rental"?"87.3%":"90%";
  const feePct  = seg==="retail"?"3%":seg==="rental"?"12.7%":"10%";
  const FN="https://arndnljtmjfsnzcpcuen.supabase.co/functions/v1/partner-items";
  const money2=c=>"$"+(c/100).toFixed(2);
  document.title=p.name+" · OceanSafe dashboard";
  root.style.setProperty("--accent",primary);
  const qrGrid = qrCats.map(([cat,label])=>
    '<div style="text-align:center"><img id="qr-'+cat+'" alt="'+esc(label)+' QR" style="width:118px;height:118px;border:1px solid #E2E8ED;border-radius:10px;background:#fff"><div style="font-weight:600;font-size:13px;margin-top:6px">'+esc(label)+'</div><a class="btn ghost sm" id="qrdl-'+cat+'" download="'+esc(p.slug)+'-'+cat+'-qr.png" style="margin-top:6px">Download</a></div>'
  ).join('');
  root.innerHTML=
  '<div class="dhead"><div class="mast"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2" stroke="oklch(0.86 0.13 88)" stroke-width="2.1" stroke-linecap="round"/><path d="M2 19c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" opacity=".6"/></svg><span>Ocean<span class="c">Safe</span></span><span class="crumb">· partner dashboard</span></div>'
    +'<div class="shop">'+esc(p.name)+'</div>'
    +(p.region?'<div class="shopmeta">'+esc(p.region)+'</div>':'')
    +'<div class="privband"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Private to you — an unguessable link, not a password. Don’t post it publicly.</span></div>'
  +'</div>'
  +'<div class="card lift"><h2>Your page</h2>'
    +'<div class="row"><a class="btn primary" href="'+esc(live)+'" target="_blank" rel="noopener">View your live page ↗</a>'
    +'<button class="btn ghost" id="copylink">Copy page link</button></div></div>'
  +(isTownAd
    ? '<div class="card"><h2><span class="t">Your assets</span></h2>'
      +'<p class="lead">Every asset here already has <b>your</b> QR code built into it. Pick the ones you want, download, and print as many as you like — they’re digital, so reprinting costs you nothing.</p>'

  +(sells?'<div class="card"><h2>Your items</h2>'
    +'<p class="lead">List what you sell — items show on your page and sell in the app. '+(isFree?('You keep <b>'+keepPct+'</b>; our '+feePct+' only applies when the app sells for you.'):'You keep <b>100%</b> on your plan.')+'</p>'
    +'<div id="itemsList" style="margin-top:12px"><span class="dim">Loading items…</span></div>'
    +'<div class="row" style="margin-top:12px;align-items:stretch">'
    +'<input id="itTitle" placeholder="Item name (e.g. Reef-safe sunscreen)" maxlength="80" style="flex:2;min-width:170px;font-size:14px;padding:9px 11px;border:1px solid #D5DCE2;border-radius:9px">'
    +'<input id="itPrice" placeholder="$ price" inputmode="decimal" style="width:90px;font-size:14px;padding:9px 11px;border:1px solid #D5DCE2;border-radius:9px">'
    +'<button class="btn primary" id="itAdd">Add item</button></div>'
    +'<div class="hint" id="itMsg">Changes are live on your page the moment you add them.</div></div>':'')
  +(!isOperator && !isTownAd?'<div class="card"><h2>Need more cards?</h2><p class="lead">Cards walk out the door — reorder anytime.</p>'
    +'<div class="row" style="margin-top:12px"><a class="btn primary" href="'+ml("More cards for "+p.name,"Hi OceanSafe team, "+p.name+" needs 200 more cards ($100). Ship to:")+'">Reorder 200 cards — $100 ↗</a></div></div>':'')
  +'<div class="card"><h2>What’s live</h2><div class="kv">'
    +'<span class="k">'+esc(noun)+'</span><span>'+esc(p.name)+'</span>'
    +(p.short?'<span class="k">Tagline</span><span>'+esc(p.short)+'</span>':'')
    +(p.region?'<span class="k">Area</span><span>'+esc(p.region)+'</span>':'')
    +(p.phone?'<span class="k">Phone</span><span>'+esc(p.phone)+'</span>':'')
    +(p.website?'<span class="k">Website</span><span><a href="'+esc(p.website)+'" target="_blank" rel="noopener">'+esc(p.website)+'</a></span>':'')
    +(ams.length?'<span class="k">On property</span><span>'+ams.map(esc).join(', ')+'</span>':'')
    +'<span class="k">Page</span><span><a href="'+esc(live)+'" target="_blank" rel="noopener">'+esc(live)+'</a></span></div>'
    +'<div class="hint">To change anything — your logo, colors, amenities, a typo — just ask and we’ll update it:</div>'
    +'<div class="row" style="margin-top:10px"><a class="btn ghost" href="'+ml("Update "+p.name+"’s OceanSafe page","Hi OceanSafe team, please update the following for "+p.name+":\n\n- ")+'">Request a change ↗</a></div></div>'
  +'<div class="card"><h2>Your plan</h2><div class="kv"><span class="k">Plan</span><span>'+esc(planTerms)+'</span>'
    +(renews?'<span class="k">Renews</span><span>'+esc(renews)+'</span>':'')+'</div>'
    +(isOperator&&isFree?'<div class="hint">Free, no card. Upgrade to unlock the sections below whenever you’re ready.</div>':'<div class="hint">We’ll email you before any renewal, no surprises.</div>')+'</div>'
  +(isTownAd ? pinCard()+promoCard()
    : lockCard("Promotions","Timed, condition-triggered offers on the guide your guests already open — the spa when the surf’s up, the right item on the right day.",isFree)
      +lockCard("Market intelligence","The full demand board — what the weather drives, when guests plan, trends and forecasts.",isFree))
  +'<div class="card"><h2>Visits &amp; scans</h2>'
    +'<div class="soonrow"><span class="dim">Page visits</span><span class="pill">Coming soon</span></div>'
    +'<div class="soonrow"><span class="dim">QR scans by placement</span><span class="pill">Coming soon</span></div>'
    +'<div class="empty">Your QR codes are already tracked by placement; the counts turn on when analytics goes live — we’ll email you. Nothing to set up.</div></div>'
  +'<div class="card"><h2>Questions?</h2><p class="lead">Email or text us — a real person. <a href="mailto:'+NICK+'">'+NICK+'</a></p>'
    +'<div class="hint">Reply to any email to change anything, or to cancel.</div></div>';
  function lockCard(title,desc,locked){
    if(locked) return '<div class="card" style="position:relative;background:#F7F9FA"><h2>'+title+' <span class="pill" style="background:#FDF4DD;color:#a9781f;border-color:#ecdca0">\uD83D\uDD12 Paid</span></h2>'

  // ── QR with the OceanSafe mark in the middle ──
  // Both constants below were MEASURED, not chosen. Do not raise either without re-running the
  // decode test — the QR is the product, and a branded QR that doesn't scan is worse than a plain one.
  //
  // errorCorrectionLevel "H" is LOAD-BEARING: the mark occludes the centre, and the library's
  // default ("M", 15% recovery) has too little budget to survive that plus a phone camera on a
  // creased thermal receipt. "H" recovers 30%.
  //
  // MARK_FRAC = 0.16. Measured cliff: at 0.22 the code still decoded in OpenCV but FAILED zbar
  // (the decoder behind many real scanners) — i.e. it would have looked fine in testing and failed
  // in the field. 0.20 was the last size passing both; 0.16 leaves headroom for the real world.
  // Verified at 0.16 on two independent decoders (zbar + OpenCV) under: downscale to 120px, focus
  // blur, faded thermal print, 8/12/20-degree rotation, and dim-light sensor noise — all pass.
  //
  // If the mark fails to load we resolve the PLAIN QR rather than nothing.
  const OS_MARK="/assets/oceansafe-favicon.png";
  const MARK_FRAC=0.16;
  function qrWithLogo(url,size){
    return new Promise((resolve,reject)=>{
      QRCode.toDataURL(url,{margin:1,width:size,errorCorrectionLevel:"H"},(e,qr)=>{
        if(e) return reject(e);
        const base=new Image();
        base.onload=()=>{
          const c=document.createElement("canvas"); c.width=c.height=size;
          const x=c.getContext("2d");
          x.drawImage(base,0,0,size,size);
          const mark=new Image();
          mark.onload=()=>{
            const s=Math.round(size*MARK_FRAC), o=Math.round((size-s)/2), pad=Math.round(s*0.14);
            const bx=o-pad, by=o-pad, bw=s+pad*2, bh=s+pad*2, br=Math.round(s*0.26);
            x.fillStyle="#fff";                       // quiet backing so the mark reads off the modules
            x.beginPath();
            if(x.roundRect) x.roundRect(bx,by,bw,bh,br); else x.rect(bx,by,bw,bh);
            x.fill();
            x.drawImage(mark,o,o,s,s);
            resolve(c.toDataURL("image/png"));
          };
          mark.onerror=()=>resolve(qr);
          mark.src=OS_MARK;
        };
        base.onerror=()=>reject(new Error("qr render failed"));
        base.src=qr;
      });
    });
  }

  if(window.QRCode){ qrCats.forEach(([cat])=>{ qrWithLogo(qrUrl(cat),240).then(url=>{ const img=document.getElementById("qr-"+cat); const dl=document.getElementById("qrdl-"+cat); if(img)img.src=url; if(dl)dl.href=url; }).catch(()=>{}); }); }

  // ── Town Ad printable assets — every asset is rendered with THIS partner's own QR ──
  // The QR encodes live?ref=<their slug>, so a scan opens the guide in their co-brand and
  // fires their promo. Rendered client-side to canvas at print resolution, downloaded as PNG.
  if(isTownAd){
    // "bare" is first on purpose: it's the one most partners actually reach for. A POS (Square,
    // Toast, Clover) takes an image for a receipt or an order screen and wants the code alone;
    // so does a sign shop laying out its own artwork. 1200px square prints clean at any size —
    // 4 in at 300dpi, 12 in at 100dpi for a window decal — because a QR is pure black-and-white
    // geometry with no photo to go soft.
    const ASSETS=[
      {key:"bare",    label:"Just the QR code",   w:1200,h:1200, sz:"any size · for your POS", layout:"bare"},
      {key:"counter", label:"Counter card",       w:1200,h:1800, sz:"4 × 6 in",        layout:"tall"},
      {key:"tent",    label:"Table tent",         w:1200,h:1800, sz:"4 × 6 in · folds", layout:"tent"},
      {key:"sticker", label:"Window sticker",     w:900, h:900,  sz:"3 × 3 in",        layout:"square"},
      {key:"receipt", label:"Receipt footer",     w:750, h:450,  sz:"2.25 in wide",    layout:"strip"},
      {key:"flyer",   label:"Flyer / menu insert",w:1650,h:2550, sz:"5.5 × 8.5 in",    layout:"tall"}
    ];
    const SAND="#FBF8F2", DEEP="#0F3D49", TEAL="#0A8BA8", INK="#16202A", MUTE="#5B6B76", GOLD="#F0B429";
    const brand="#"+(p.primary_hex||"0a8ba8").replace(/^#/,"");
    const F=(w,s)=>w+" "+Math.round(s)+"px Inter,-apple-system,Segoe UI,system-ui,sans-serif";
    function wave(x,cx,cy,w,col){ x.strokeStyle=col; x.lineWidth=w*0.075; x.lineCap="round"; x.beginPath();
      for(let i=0;i<=w;i+=1){ const yy=cy+Math.sin((i/w)*Math.PI*3)*(w*0.055); i?x.lineTo(cx+i-w/2,yy):x.moveTo(cx+i-w/2,yy); } x.stroke(); }
    // Header lockup: the REAL OceanSafe icon beside the wordmark, centred as a group. Replaces
    // the drawn gold squiggle that sat under the text — the squiggle was a stand-in for the
    // wave, and the favicon IS the wave, so carrying both was redundant.
    // markImg may be null (the icon failed to load) → fall back to the drawn wave rather than
    // ship a header with a hole in it. A partner's assets must never depend on one PNG.
    function lockup(x,W,cy,iconSize,fontPx,markImg,waveFallbackW){
      if(!markImg){ wave(x,W/2,cy+iconSize*0.34,waveFallbackW,GOLD); return; }
      x.font=F(800,fontPx);
      const t="OceanSafe", tw=x.measureText(t).width, gap=iconSize*0.30;
      const sx=(W-(iconSize+gap+tw))/2;
      const _ta=x.textAlign, _tb=x.textBaseline;
      x.drawImage(markImg,sx,cy-iconSize/2,iconSize,iconSize);
      x.textAlign="left"; x.textBaseline="middle"; x.fillStyle="#fff";
      x.fillText(t,sx+iconSize+gap,cy);
      x.textAlign=_ta; x.textBaseline=_tb;
    }
    function drawAsset(spec,qrImg,markImg){
      const c=document.createElement("canvas"); c.width=spec.w; c.height=spec.h;
      const x=c.getContext("2d"), W=spec.w, H=spec.h;
      // Draw the QR with smoothing OFF — canvas interpolation softens module edges and can make
      // a higher-version code (long slug) undecodable. Mirrors d.html; keep the two in step.
      const qr=(img,dx,dy,dw,dh)=>{ const sm=x.imageSmoothingEnabled; x.imageSmoothingEnabled=false;
        x.drawImage(img,dx,dy,dw,dh); x.imageSmoothingEnabled=sm; };
      x.fillStyle=SAND; x.fillRect(0,0,W,H); x.textBaseline="top";
      // Bare QR — nothing but the code. This is the one a POS wants: Square/Toast/Clover let you
      // drop an image onto a receipt or an order screen, and they want the code alone, not a
      // designed card. Also what a sign shop asks for when they're laying out their own artwork.
      // WHITE background, not SAND: thermal receipt printers threshold to pure black/white, and
      // a tinted quiet zone can dither into speckle that costs you the scan. The quiet zone is
      // ~8% a side — the QR spec's minimum is 4 modules, and below that scanners lose the finder
      // pattern against whatever it's printed beside.
      if(spec.layout==="bare"){
        x.fillStyle="#fff"; x.fillRect(0,0,W,H);
        const pad=Math.round(W*0.08), q=W-pad*2;
        qr(qrImg,pad,pad,q,q);
        return c;
      }
      if(spec.layout==="strip"){                    // receipt: QR left, copy right
        const pad=H*0.11, q=H-pad*2; qr(qrImg,pad,pad,q,q);
        const tx=pad*1.6+q;
        // The strip is only 2.25in wide and the QR takes ~47% of it, leaving ~270px for copy.
        // At the design sizes every line overflowed the canvas and was cut mid-word on a real
        // printed receipt ("Free Maui be…", "Your Beach Gril…"). Step each line down until it
        // fits its box. Sizes are a CEILING now, not a fixed value — long business names and
        // "Hawaiʻi Island" shrink to fit instead of running off the edge.
        const maxW=W-tx-pad*0.6;
        const fitFont=(t,weight,px)=>{ let s=px; while(s>8){ x.font=F(weight,s); if(x.measureText(t).width<=maxW) break; s-=1; } return s; };
        const line=(t,weight,px,y,fill)=>{ fitFont(t,weight,px); x.fillStyle=fill; x.fillText(t,tx,y); };
        // Fit the headline first — it is the longest string, so it sets the scale. Everything
        // below is capped to it, or a long business name ends up dwarfing the headline it sits
        // under (which is what happens if each line is fitted independently).
        const hs=fitFont("Free "+islandName+" beach guide",700,H*0.125);
        line("Free "+islandName+" beach guide",700,hs,pad+H*0.02,INK);
        line("Scan: today’s surf, wind, and",400,Math.min(H*0.093,hs*0.74),pad+H*0.24,MUTE);
        line("which beaches are calm.",400,Math.min(H*0.093,hs*0.74),pad+H*0.37,MUTE);
        line(p.name.slice(0,26),700,Math.min(H*0.10,hs*0.8),pad+H*0.58,brand);
        return c;
      }
      if(spec.layout==="square"){                   // window sticker
        x.fillStyle=DEEP; x.fillRect(0,0,W,H*0.26);
        x.textAlign="center";
        lockup(x,W,H*0.13,W*0.115,W*0.075,markImg,W*0.28);
        const q=W*0.52; x.fillStyle="#fff"; x.fillRect(W/2-q/2-W*0.02,H*0.33,q+W*0.04,q+W*0.04);
        qr(qrImg,W/2-q/2,H*0.34,q,q);
        x.fillStyle=INK; x.font=F(700,W*0.062); x.fillText("Free beach guide",W/2,H*0.885);
        x.fillStyle=brand; x.font=F(600,W*0.042); x.fillText(p.name.slice(0,30),W/2,H*0.945);
        x.textAlign="left"; return c;
      }
      // tall + tent
      const band=H*0.145; x.fillStyle=DEEP; x.fillRect(0,0,W,band);
      x.textAlign="center";
      lockup(x,W,band*0.5,W*0.085,W*0.062,markImg,W*0.20);
      x.fillStyle=INK; x.font=F(800,W*0.075); x.fillText("Free "+islandShort,W/2,band+H*0.045);
      x.fillText("beach guide",W/2,band+H*0.088);
      x.fillStyle=MUTE; x.font=F(400,W*0.038);
      x.fillText("Today’s surf, wind, and which",W/2,band+H*0.142);
      x.fillText("beaches are calm right now.",W/2,band+H*0.172);
      const q=W*0.56, qy=band+H*0.225;
      x.fillStyle="#fff"; x.shadowColor="rgba(15,61,73,.18)"; x.shadowBlur=W*0.03; x.shadowOffsetY=W*0.012;
      x.fillRect(W/2-q/2-W*0.028,qy-W*0.028,q+W*0.056,q+W*0.056); x.shadowColor="transparent";
      qr(qrImg,W/2-q/2,qy,q,q);
      x.fillStyle=TEAL; x.font=F(700,W*0.040); x.fillText("Scan with your phone camera",W/2,qy+q+W*0.055);
      const fy=qy+q+W*0.115;
      x.fillStyle=brand; x.font=F(800,W*0.052); x.fillText(p.name.slice(0,28),W/2,fy);
      x.fillStyle=MUTE; x.font=F(400,W*0.032); x.fillText("oceansafety.app",W/2,fy+W*0.068);
      if(spec.layout==="tent"){                     // fold guide
        x.strokeStyle="#C9D4DA"; x.lineWidth=2; x.setLineDash([12,10]);
        x.beginPath(); x.moveTo(0,H*0.5); x.lineTo(W,H*0.5); x.stroke(); x.setLineDash([]);
        x.fillStyle="#9AA9B2"; x.font=F(400,W*0.026); x.fillText("fold here",W/2,H*0.5+W*0.012);
      }
      x.textAlign="left"; return c;
    }
    // The header lockup needs the real mark as a loaded image. Resolve it alongside the QR and
    // NEVER let it block: if the icon 404s we resolve null and drawAsset falls back to the drawn
    // wave. A missing logo must not cost the partner their printable assets.
    const markReady = new Promise(resolve=>{
      const m=new Image(); m.onload=()=>resolve(m); m.onerror=()=>resolve(null); m.src=OS_MARK;
    });
    Promise.all([qrWithLogo(qrUrl("receipt"),1400), markReady]).then(([url,markImg])=>{
      const grid=document.getElementById("assetGrid"); if(!grid) return;
      const qrImg=new Image();
      qrImg.onload=()=>{
        grid.innerHTML="";
        ASSETS.forEach(spec=>{
          let png; try{ png=drawAsset(spec,qrImg,markImg).toDataURL("image/png"); }catch(_){ return; }
          const d=document.createElement("div"); d.className="asset";
          d.innerHTML='<div class="thumb"><img alt="'+esc(spec.label)+' with your QR code" src="'+png+'"></div>'
            +'<div class="nm">'+esc(spec.label)+'</div><div class="sz">'+esc(spec.sz)+'</div>'
            +'<a class="btn ghost sm" download="'+esc(p.slug)+'-'+spec.key+'.png" href="'+png+'">Download</a>';
          grid.appendChild(d);
        });
      };
      qrImg.onerror=()=>{ grid.innerHTML='<span class="dim">Couldn’t build your assets — email us and we’ll send them over.</span>'; };
      qrImg.src=url;
    }).catch(()=>{
      const grid=document.getElementById("assetGrid");
      if(grid) grid.innerHTML='<span class="dim">Couldn’t build your assets — email us and we’ll send them over.</span>';
    });
  }
})();
</script>
</body></html>
