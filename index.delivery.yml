# Delivery spec for index.html, the guest app, on the HTA/GoHawaii REVIEW site only.
# Written 2026-09-22 by os-release-captain, Phase 1, before the culture-toggle build ships.
# Branch work/culture-toggle, worktree ~/Desktop/OceanSafe/wt-culture, HEAD 4ff1b55, sw v373.
recipient: Nick first; then State (HTA/HVCB) and county staff, each signing in with a personal staff key Nick issues. Visitors reach the app through the GoHawaii link. Review site only (htagohawaii.netlify.app, Netlify 5da479a8), never production.
segment: public
tier: free
fulfillment: since 2026-09-23 the GoHawaii link reads published posts and place changes from gohawaii-api and sends daily visit totals with no id and no location (none under Do Not Track); otherwise none. Nothing provisions, nothing charges, there is no account, no signup, no Square link, no OceanSafe money term anywhere in this build. Client-side state: localStorage os_theme (culture | default) and the service worker rolling v346-2026-09-19-gh-tsunami to v373-2026-09-22-culture-tour-rework. Surface is https://htagohawaii.netlify.app/?ref=gohawaii&island=<kauai|oahu|maui|hawaii>, Netlify site 5da479a8-b456-4bc1-aafc-604350e62de6. Production a1a7b085 is never touched. Culture layer is opt-in: ?theme=culture or the leaf button at index.html:2275, which is in the markup unconditionally and is therefore one tap from every visitor
must_be_true_after: with the theme OFF the app is byte-for-byte what is live today (culture-offtest.js, all four islands) and every safety string is identical. With the theme ON: the engraved plate is drawn from the State GIS ahupuaa polygons, not from a photographed survey sheet; OSM road line work carries its credit on screen; the four-step tour, the ahupuaa and moku cards and the Hawaiian-first names render with zero rows from culture/places (0 approved rows on all four islands today), so no moolelo, no wahi pana and no guest protocol text can appear before the Native Hawaiian review partner approves it; every beach status word in step 4 is the app's own string passed through; no OceanSafe offer, price or fee appears with the theme on or off; a returning reviewer is served v373 and not the cached v346
layer_data: data/poi-gohawaii-*.js, gh/beaches.json, culture/places/*.csv
